     INCLUDE の目印に web/view.html(表示部)と web/menu.html(メニュー部)を差し込んで1枚のページにする。 -->

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(path, opts = {}) {
  const init = { method: opts.method || "GET", headers: {} };
  if (opts.body !== undefined) { init.headers["Content-Type"] = "application/json"; init.body = JSON.stringify(opts.body); }
  const res = await fetch(path, init);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || `エラー (${res.status})`); e.status = res.status; throw e; }
  return data;
}
const debounce = (fn, ms = 180) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const pct = x => x.toFixed(2) + "%";
const dur = sec => {
  sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const p = n => String(n).padStart(2, "0");
  return h ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
};
const rarity = (ja, key) => `<span class="rar ${esc(key)}">${esc(ja)}</span>`;
const noData = msg => `<div class="empty">${esc(msg)}</div>`;
const catTag = (key, ja) => `<span class="cat ${esc(key)}">${esc(ja)}</span>`;
const fmtPct = x => x >= 1 ? x.toFixed(2) + "%" : x >= 0.01 ? x.toFixed(3) + "%" : x.toPrecision(2) + "%";
/** 見出しクリックで並べ替える表 (state = {key, dir}) */
function sortRows(rows, state, getters) {
  const g = getters[state.key]; if (!g) return rows;
  const dir = state.dir === "asc" ? 1 : -1;
  return rows.slice().sort((a, b) => {
    const x = g(a), y = g(b);
    if (x === y) return 0;
    if (x === null || x === undefined) return 1;
    if (y === null || y === undefined) return -1;
    return (typeof x === "string" ? x.localeCompare(y, "ja") : x - y) * dir;
  });
}
const th = (label, key, state, cls = "") =>
  `<th class="sort ${cls}" data-sort="${key}" aria-sort="${state.key === key ? (state.dir === "asc" ? "ascending" : "descending") : "none"}" tabindex="0">${label}</th>`;
function onSortClick(container, state, render, numericKeys = []) {
  const handler = e => {
    const h = e.target.closest("th[data-sort]"); if (!h) return;
    if (e.type === "keydown" && e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault();
    const k = h.dataset.sort;
    if (state.key === k) state.dir = state.dir === "asc" ? "desc" : "asc";
    else { state.key = k; state.dir = numericKeys.includes(k) ? "desc" : "asc"; }
    render();
  };
  container.addEventListener("click", handler); container.addEventListener("keydown", handler);
}

</script>
<!-- INCLUDE:menu.html#script -->
<script>
/* ---------- ロゴ ---------- */
/* 公式ファンキットのロゴは同梱していない。各自の PC に取得済み(初回起動時に自動取得)ならヘッダーに使う */
let logoApplied = false;
function applyLogo() {
  if (logoApplied) return;
  logoApplied = true;
  const img = new Image();
  img.onload = () => {
    const root = document.documentElement.style;
    root.setProperty("--logo-url", "url(/logo.png)");
    if (img.naturalHeight) root.setProperty("--logo-ratio", (img.naturalWidth / img.naturalHeight).toFixed(4));
  };
  img.onerror = () => { logoApplied = false; };
  img.src = "/logo.png";
}

/* ---------- ステータス ---------- */
let hasData = false;
async function refreshStatus() {
  const pill = $("#status-pill");
  try {
    const s = await api("/api/status");
    hasData = s.has_drops;
    if (s.version) $("#app-ver").textContent = `v${s.version}`;
    if (s.has_logo) applyLogo();
    pill.classList.toggle("warn", !s.has_drops);
    pill.textContent = s.has_drops ? `データ ${s.drops_updated} 取得 / 項目 ${s.counts.items}` : "データ未取得 — 「データ更新」から取得してください";
    const info = $("#update-info");
    info.innerHTML = s.has_drops
      ? `<dt>ドロップ表</dt><dd>${esc(s.drops_updated)} に取得(${s.counts.nodes} ノード / 全 ${s.counts.items} 項目)</dd>
         <dt>敵・バウンティ等</dt><dd>${s.extra_files ? `${esc(s.extra_updated)} に取得(${s.extra_files} / ${s.extra_total} ファイル、${s.counts.sources.toLocaleString()} 件)` : "未取得"}</dd>
         <dt>Riven相場</dt><dd>${s.rivens_updated ? `${esc(s.rivens_updated)} に取得(${s.rivens_count} 件)` : "未取得"}</dd>
         <dt>日本語名辞書</dt><dd>${s.has_names ? esc((s.names_updated || "").replace("T", " ").replace("+00:00", " UTC")) + " に取得" + (s.names_source ? `(${esc(s.names_source)} / MOD ${s.counts.mods} 件)` : "") : "未取得(英語名で表示されます)"}</dd>`
      : `<dt>状態</dt><dd>まだデータがありません</dd>`;
    return s;
  } catch (e) { pill.textContent = "サーバーに接続できません"; pill.classList.add("warn"); }
}

/* ---------- 入手先の検索(素材から探す・パーツ検索で共用) ---------- */
/** 入手先の表 (素材から探す / MOD 一覧の詳細で共用) */
function sourceTable(rows) {
  const max = Math.max(...rows.map(x => x.chance ?? 0), 0.0001);  // 確率の無い入手先(クラン研究)は「—」でバーを出さない
  return `<div class="tablewrap"><table>
    <thead><tr><th>種類</th><th>入手先</th><th>詳細</th><th>ステージ</th><th>確率</th><th>レア度</th></tr></thead>
    <tbody>${rows.map(x => `<tr><td>${catTag(x.cat, x.cat_ja)}</td><td>${esc(x.place)}${x.event ? '<span class="tag-event">イベント</span>' : ""}</td>
      <td>${esc(x.detail)}</td><td>${esc(x.stage)}</td>
      <td>${x.chance == null ? "—" : `<div class="chance"><div class="bar"><i style="--w:${(x.chance / max * 100).toFixed(1)}%"></i></div><b>${x.qty ? esc(x.qty) + "個 " : ""}${fmtPct(x.chance)}</b></div>`}</td>
      <td>${x.rarity ? rarity(x.rarity, x.rarity_key) : ""}</td></tr>`).join("")}</tbody></table></div>`;
}
/**
 * 名前で候補を出し、選んだ項目の入手先(/api/item)を表にするページを作る。部品は #<id>-q #<id>-chips #<id>-out #<id>-ev
 * o.id: ページの id / o.suggest(q): 候補を取る URL / o.list(res): 応答から候補の配列を取り出す(既定は応答そのもの)
 * o.onSuggest(res): 候補を受け取ったとき(カテゴリーの描画など) / o.more(res, list): 候補の後ろに足す HTML
 * o.msg: noMatch(res) 候補なし / pick 候補から選ぶ / empty 何も入っていない / noData データなし(どれも文字を返す関数)
 * 返り値: load(ページを開いたとき) / search(autoPick)(候補を取り直す) / reset(データ更新の後)
 */
function sourceSearch(o) {
  const el = part => $(`#${o.id}-${part}`);
  const list = o.list || (res => res);
  let key = null, cat = "", data = null;
  const chip = i => `<button class="chip" data-key="${esc(i.key)}" aria-pressed="${i.key === key}">${esc(i.ja)}${i.ja !== i.en ? `<small>${esc(i.en)}</small>` : ""}</button>`;
  async function loadChips() {
    try {
      const res = await api(o.suggest(el("q").value)), items = list(res);
      if (o.onSuggest) o.onSuggest(res);
      el("chips").innerHTML = items.length ? items.map(chip).join("") + (o.more ? o.more(res, items) : "")
        : `<span class="note">${esc(o.msg.noMatch(res))}</span>`;
      return items;
    } catch (e) { el("chips").innerHTML = ""; el("out").innerHTML = noData(e.message); return []; }
  }
  function renderResult() {
    const r = data; if (!r) return;
    if (cat && !r.cats.some(c => c.key === cat)) cat = "";
    const rows = cat ? r.rows.filter(x => x.cat === cat) : r.rows;
    el("out").innerHTML = `
    <div class="result-head"><h3>${esc(r.ja)}</h3><span class="en">${esc(r.en)}</span><span class="count">${r.total} か所</span></div>
    ${r.cats.length > 1 ? `<div class="seg" role="group" aria-label="入手先の種類">
      <button class="chip" data-cat="" aria-pressed="${!cat}">すべて<small>${r.total}</small></button>
      ${r.cats.map(c => `<button class="chip" data-cat="${esc(c.key)}" aria-pressed="${cat === c.key}">${esc(c.ja)}<small>${c.n}</small></button>`).join("")}</div>` : ""}
    ${sourceTable(rows)}
    <p class="note">確率: ミッション/バウンティは報酬1回の抽選で選ばれる割合(A→B→C はローテーション)、敵は1体倒したときに落とす割合(「MODドロップ 3%」などは、その敵が MOD を落とす確率を掛けた後の値)、レリックは開けたときに出る割合です。クラン研究・Simaris 交換・クエスト報酬は確率が無いので「—」です。</p>`;
  }
  async function loadResult() {
    if (!key) { el("out").innerHTML = ""; return; }
    try {
      data = await api(`/api/item?key=${encodeURIComponent(key)}&events=${el("ev").checked ? 1 : 0}`);
      renderResult();
    } catch (e) { data = null; el("out").innerHTML = noData(e.message); }
  }
  const markChips = () => el("chips").querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.key === key));
  async function search(autoPick) {
    const items = await loadChips();
    if (!items || !items.length) { key = null; el("out").innerHTML = ""; return; }
    const q = el("q").value.trim();
    if (autoPick || !items.some(i => i.key === key)) {
      const exact = q && items.find(i => [i.ja, i.en].some(n => n.toLowerCase() === q.toLowerCase()));
      key = exact ? exact.key : (q && items.length === 1 ? items[0].key : (q ? null : key));
      if (key) markChips();
    }
    if (!key) el("out").innerHTML = `<div class="empty">${esc(q ? o.msg.pick() : o.msg.empty())}</div>`;
    else await loadResult();
  }
  el("out").addEventListener("click", e => {
    const c = e.target.closest("[data-cat]"); if (!c) return;
    cat = c.dataset.cat; renderResult();
  });
  el("q").addEventListener("input", debounce(() => search(true)));
  el("ev").addEventListener("change", loadResult);
  el("chips").addEventListener("click", e => {
    const c = e.target.closest(".chip[data-key]"); if (!c) return;
    key = c.dataset.key; cat = "";
    markChips();
    loadResult();
  });
  return {
    search,
    async load() {
      const s = await refreshStatus();
      if (!s || !s.has_drops) { el("chips").innerHTML = ""; el("out").innerHTML = noData(o.msg.noData()); return; }
      if (!el("chips").children.length || !key) await search(true);
    },
    reset() { key = null; data = null; el("chips").innerHTML = ""; },
  };
}

/* ---------- 素材から探す ---------- */
const itemSearch = sourceSearch({
  id: "item",
  suggest: q => `/api/suggest/item?q=${encodeURIComponent(q)}&materials=${$("#item-mat").checked ? 1 : 0}`,
  msg: {
    noMatch: () => "一致する項目がありません" + ($("#item-mat").checked ? "(「素材のみ」を外すとMODや設計図も探せます)" : ""),
    pick: () => "候補から選んでください。",
    empty: () => "素材を選ぶか、名前を入力してください。",
    noData: () => "データがありません。「データ更新」から取得してください。",
  },
});
$("#item-mat").addEventListener("change", () => itemSearch.search(false));
loaders.item = itemSearch.load;

/* ---------- パーツ検索 ---------- */
/* Warframe・武器などの本体・設計図・パーツだけを候補に出す。カテゴリーはマスター一覧と同じ(ファウンダー・その他は除く) */
let partCat = "";
try { partCat = localStorage.getItem("wf-part-cat") || ""; } catch (e) {}
if (partCat && t("part.cat." + partCat) === "part.cat." + partCat) partCat = "";  // 今は無いカテゴリーが残っていたら外す
try { $("#part-noprime").checked = localStorage.getItem("wf-part-noprime") === "1"; } catch (e) {}
const partFmt = (key, vals) => Object.entries(vals).reduce((s, [k, v]) => s.split("{" + k + "}").join(v), t(key));
const partSearch = sourceSearch({
  id: "part",
  suggest: q => `/api/suggest/part?q=${encodeURIComponent(q)}&cat=${encodeURIComponent(partCat)}&noprime=${$("#part-noprime").checked ? 1 : 0}`,
  list: res => res.items,
  onSuggest: res => {
    const all = res.cats.reduce((n, c) => n + c.n, 0);
    // 選んでいるカテゴリーに名前の合う候補が無いときも、ボタンは 0 件で残す(押し直して外せるように)
    const cats = partCat && !res.cats.some(c => c.key === partCat) ? [...res.cats, { key: partCat, n: 0 }] : res.cats;
    $("#part-cats").innerHTML = `<button class="chip" data-pcat="" aria-pressed="${!partCat}">${esc(t("part.cat.all"))}<small>${all}</small></button>`
      + cats.map(c => `<button class="chip" data-pcat="${esc(c.key)}" aria-pressed="${partCat === c.key}">${esc(t("part.cat." + c.key))}<small>${c.n}</small></button>`).join("");
  },
  more: (res, items) => res.total > items.length ? `<span class="note">${esc(partFmt("part.more", { n: res.total - items.length }))}</span>` : "",
  msg: {
    noMatch: () => t("part.nomatch"),
    pick: () => t("part.pick"),
    empty: () => t("part.empty"),
    noData: () => t("part.nodata"),
  },
});
$("#part-cats").addEventListener("click", e => {
  const c = e.target.closest("[data-pcat]"); if (!c) return;
  partCat = c.dataset.pcat;
  try { localStorage.setItem("wf-part-cat", partCat); } catch (err) {}
  partSearch.search(false);
});
$("#part-noprime").addEventListener("change", e => {  // 入手先がレリックのもの(Prime)を候補から外す。この PC に覚えさせる
  try { localStorage.setItem("wf-part-noprime", e.target.checked ? "1" : "0"); } catch (err) {}
  partSearch.search(false);
});
loaders.part = () => {
  applyViewText("part");
  $("#part-q").placeholder = t("part.placeholder");
  $("#part-cats").setAttribute("aria-label", t("part.cats"));
  return partSearch.load();
};

/* ---------- エリアから探す ---------- */
let areaSel = null;
async function loadAreaChips() {
  try {
    const list = await api(`/api/suggest/area?q=${encodeURIComponent($("#area-q").value)}`);
    $("#area-chips").innerHTML = list.length ? list.map(i =>
      `<button class="chip" data-type="${i.type}" data-key="${esc(i.key)}" aria-pressed="${areaSel && areaSel.key === i.key && areaSel.type === i.type}">${esc(i.ja)}${i.sub ? `<small>${esc(i.sub)}</small>` : ""}</button>`).join("")
      : `<span class="note">一致するエリアがありません</span>`;
    return list;
  } catch (e) { $("#area-out").innerHTML = noData(e.message); return []; }
}
async function loadAreaResult() {
  if (!areaSel) { $("#area-out").innerHTML = `<div class="empty">惑星またはノードを選んでください。</div>`; return; }
  try {
    const r = await api(`/api/area?type=${areaSel.type}&key=${encodeURIComponent(areaSel.key)}&all=${$("#area-all").checked ? 1 : 0}&events=${$("#area-ev").checked ? 1 : 0}`);
    if (!r.nodes.length) { $("#area-out").innerHTML = `<div class="result-head"><h3>${esc(r.title)}</h3></div>` + noData("表示できるドロップがありません(「素材以外も表示」で増える場合があります)。"); return; }
    $("#area-out").innerHTML = `<div class="result-head"><h3>${esc(r.title)}</h3><span class="count">${r.nodes.length} ノード</span></div>
      <div class="cards">${r.nodes.map(n => {
        const max = Math.max(1, ...n.stages.flatMap(s => s.items.map(i => i.chance)));
        const rows = n.stages.flatMap(s => s.items.map((i, k) => `<tr><td>${k === 0 ? esc(s.stage) : ""}</td><td>${esc(i.ja)}</td>
          <td><div class="chance" style="min-width:150px"><div class="bar"><i style="--w:${(i.chance / max * 100).toFixed(1)}%"></i></div><b>${pct(i.chance)}</b></div></td>
          <td>${rarity(i.rarity, i.rarity_key)}</td></tr>`)).join("");
        return `<div class="card"><header><b>${esc(n.node)}</b><span>${esc(n.planet)} / ${esc(n.mode)}${n.event ? '<span class="tag-event">イベント</span>' : ""}</span></header>
          ${rows ? `<div class="tablewrap"><table><thead><tr><th>ステージ</th><th>アイテム</th><th>確率</th><th>レア度</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="empty">素材のドロップはありません</div>`}</div>`;
      }).join("")}</div>`;
  } catch (e) { $("#area-out").innerHTML = noData(e.message); }
}
$("#area-q").addEventListener("input", debounce(async () => {
  const list = await loadAreaChips(); const q = $("#area-q").value.trim();
  if (q && list && list.length === 1) { areaSel = { type: list[0].type, key: list[0].key }; await loadAreaChips(); loadAreaResult(); }
}));
$("#area-all").addEventListener("change", loadAreaResult);
$("#area-ev").addEventListener("change", loadAreaResult);
$("#area-chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  areaSel = { type: c.dataset.type, key: c.dataset.key };
  $("#area-chips").querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === c));
  loadAreaResult();
});
loaders.area = async () => {
  const s = await refreshStatus();
  if (!s || !s.has_drops) { $("#area-chips").innerHTML = ""; $("#area-out").innerHTML = noData("データがありません。「データ更新」から取得してください。"); return; }
  await loadAreaChips(); await loadAreaResult();
};

/* ---------- MOD 入手一覧 ---------- */
let mods = null, modMeta = null, modOpen = null;
const modSort = { key: "ja", dir: "asc" };
const RAR_ORDER = { Common: 1, Uncommon: 2, Rare: 3, Legendary: 4 };
const modGetters = {
  ja: m => m.ja.toLowerCase(), type: m => m.type_ja, pol: m => m.polarity_name, rar: m => RAR_ORDER[m.rarity] || 0,
  total: m => m.total, best: m => m.best ? m.best.chance : null, own: m => (m.owned ? 1 : 0),
};
function modFilter() {
  const q = $("#mods-q").value.trim().toLowerCase(), t = $("#mods-type").value, r = $("#mods-rar").value,
    src = $("#mods-src").value, own = $("#mods-own").value;
  return mods.filter(m => (!t || m.type === t) && (!r || m.rarity === r) &&
    (!own || (own === "yes") === m.owned) &&
    (!src || (src === "any" ? m.total > 0 : src === "none" ? m.total === 0 : (m.counts[src] || 0) > 0)) &&
    (!q || [m.ja, m.en, m.compat, m.compat_ja].some(x => (x || "").toLowerCase().includes(q))));
}
function renderMods() {
  if (!mods) return;
  const list = sortRows(modFilter(), modSort, modGetters);
  const owned = mods.filter(m => m.owned).length, shownOwned = list.filter(m => m.owned).length;
  $("#mods-summary").innerHTML = `<span>表示 <b class="count">${list.length}</b> / ${mods.length} 件(うち所持 ${shownOwned})</span>
    <span>全体の所持 ${owned} / ${mods.length}(${(owned / mods.length * 100).toFixed(1)}%)</span>
    <span class="progress" aria-hidden="true"><i style="--w:${(owned / mods.length * 100).toFixed(1)}%"></i></span>`;
  if (!list.length) { $("#mods-out").innerHTML = noData("条件に合う MOD がありません。"); return; }
  const shown = list.slice(0, 600);
  $("#mods-out").innerHTML = `<div class="tablewrap tall"><table>
    <thead><tr>${th("所持", "own", modSort, "chk")}${th("MOD", "ja", modSort)}${th("種別", "type", modSort)}${th("極性", "pol", modSort)}${th("レア度", "rar", modSort)}
      ${th("入手先(件数)", "total", modSort)}${th("最も確率が高い入手先", "best", modSort)}</tr></thead>

/* ---------- ゲーム画面から MOD を読み取って所持チェック ---------- */
const AUTO_SCORE = 0.9;  // これ以上の一致度なら自動でチェック。未満は「要確認」
let scan = { on: false, stream: null, timer: null, busy: false, last: null, frames: 0, reads: 0, added: [], maybe: new Map(), seen: new Set() };
function scanRender(state) {
  $("#scan-panel").hidden = false;
  if (state !== undefined) $("#scan-state").textContent = state;
  $("#scan-stats").textContent = `読み取り ${scan.reads} 回 / 見つけた MOD ${scan.seen.size} 件 / 新しく所持にした ${scan.added.length} 件`;
  $("#scan-new").innerHTML = scan.added.length ? `<span class="mini">新しく所持にした(× で取り消し)</span><div class="chips">${scan.added.slice(-60).reverse()
    .map(en => `<button class="chip" data-undo="${esc(en)}">${esc(en)}<span class="x" aria-hidden="true">×</span></button>`).join("")}</div>` : "";
  const maybe = [...scan.maybe.values()];
  $("#scan-maybe").innerHTML = maybe.length ? `<span class="mini">要確認(クリックで所持にする)</span><div class="chips">${maybe
    .map(m => `<button class="chip" data-own="${esc(m.en)}" title="読み取り: ${esc(m.read)}">${esc(m.en)}<small>${Math.round(m.score * 100)}%</small></button>`).join("")}</div>` : "";
}
async function markOwned(list, owned) {
  if (!list.length) return;
  await api("/api/mods/owned", { method: "POST", body: { en: list, owned } });
  if (mods) { const set = new Set(list.map(x => x.toLowerCase())); mods.forEach(m => { if (set.has(m.en.toLowerCase())) m.owned = owned; }); renderMods(); }
}
async function scanImage(blob) {
  const res = await fetch("/api/mods/scan", { method: "POST", headers: { "Content-Type": blob.type || "image/png" }, body: blob });
  const r = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(r.error || `エラー (${res.status})`);
  scan.reads++;
  const confirm = $("#scan-confirm").checked, add = [];
  r.found.forEach(m => {
    scan.seen.add(m.en.toLowerCase());
    if (m.owned || scan.added.includes(m.en)) return;
    if (m.score >= AUTO_SCORE && !confirm) add.push(m.en);
    else scan.maybe.set(m.en.toLowerCase(), m);
  });
  if (add.length) { await markOwned(add, true); scan.added.push(...add); add.forEach(en => scan.maybe.delete(en.toLowerCase())); }
  return r.found.length;
}
/** 画面が前回の読み取りから変わったか(小さく縮めた白黒画像の差で判断) */
function frameChanged(video) {
  const c = document.createElement("canvas"); c.width = 64; c.height = 36;
  const g = c.getContext("2d", { willReadFrequently: true }); g.drawImage(video, 0, 0, 64, 36);
  const px = g.getImageData(0, 0, 64, 36).data, cur = new Uint8Array(64 * 36);
  for (let i = 0; i < cur.length; i++) cur[i] = (px[i * 4] + px[i * 4 + 1] + px[i * 4 + 2]) / 3;
  const prev = scan.last; scan.last = cur;
  if (!prev) return true;
  let d = 0; for (let i = 0; i < cur.length; i++) d += Math.abs(cur[i] - prev[i]);
  return d / cur.length > 1.5;
}
async function scanTick() {
  const v = $("#scan-video");
  if (!scan.on || scan.busy || !v.videoWidth) return;
  scan.frames++;
  if (!frameChanged(v)) { scanRender("読み取り中(画面の変化を待っています)"); return; }
  scan.busy = true;
  try {
    const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext("2d").drawImage(v, 0, 0);
    const blob = await new Promise(r => c.toBlob(r, "image/png"));
    scanRender("読み取り中...");
    const n = await scanImage(blob);
    scanRender(`読み取り中(直前の画面で ${n} 件の MOD 名を確認)`);
  } catch (e) { scanRender(`読み取りに失敗しました: ${e.message}`); scan.last = null; }
  scan.busy = false;
}
async function scanStart() {
  const info = await loadOcrInfo();
  if (!info.available) { scanRender(`使えません: ${info.reason || "文字認識が使えません"}`); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) { scanRender("このブラウザは画面の取り込みに対応していません。Chrome か Edge で開いてください。"); return; }
  try {
    scan.stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 2 }, audio: false });
  } catch (e) { scanRender("画面の共有がキャンセルされました。"); return; }
  const v = $("#scan-video"); v.srcObject = scan.stream; await v.play().catch(() => {});
  scan.stream.getVideoTracks()[0].addEventListener("ended", scanStop);  // ブラウザ側で「共有を停止」したとき
  scan.on = true; scan.last = null;
  $("#scan-toggle").setAttribute("aria-pressed", "true"); $("#scan-toggle").textContent = "ゲーム画面の読み取り: ON";
  scanRender("読み取り中...");
  scan.timer = setInterval(scanTick, 2500); scanTick();
}
function scanStop() {
  scan.on = false; clearInterval(scan.timer); scan.timer = null;
  if (scan.stream) scan.stream.getTracks().forEach(t => t.stop());
  scan.stream = null; $("#scan-video").srcObject = null;
  $("#scan-toggle").setAttribute("aria-pressed", "false"); $("#scan-toggle").textContent = "ゲーム画面の読み取り: OFF";
  if (!$("#scan-panel").hidden) scanRender("停止しました");
}
$("#scan-toggle").addEventListener("click", () => scan.on ? scanStop() : scanStart());

  const files = [...e.target.files]; e.target.value = "";

  if (!info.available) { scanRender(`使えません: ${info.reason || "文字認識が使えません"}`); return; }
  for (let i = 0; i < files.length; i++) {
    scanRender(`スクリーンショットを読み取り中... ${i + 1} / ${files.length}`);
    try { await scanImage(files[i]); } catch (err) { scanRender(`${files[i].name} を読み取れませんでした: ${err.message}`); return; }
  }
  scanRender(`スクリーンショット ${files.length} 枚を読み取りました`);
});

    if (own) { const en = own.dataset.own; await markOwned([en], true); scan.maybe.delete(en.toLowerCase()); scan.added.push(en); scanRender(); }
  } catch (err) { scanRender(err.message); }
});

let inv = null;

function invReward(r) {

/* ---------- Tips ---------- */
/* tips フォルダのメモ(.md / .txt / .csv)を表示する。.md は簡単な書き方(見出し・表・箇条書きなど)に対応 */
let tipsList = null, tipCur = null, tipSeq = 0, tipFile = null, tipHeads = "", tipTrashOpen = false;
try { tipCur = localStorage.getItem("wf-tip"); } catch (e) {}
const TIP_KINDS = /\.(md|markdown|txt|csv)$/i, TIP_IMAGES = /\.(png|jpe?g|gif|webp)$/i;
function tipResolve(base, src) {  // メモのファイルから見た相対パス -> tips フォルダの中のパス
  let s = src; try { s = decodeURIComponent(src); } catch (e) {}
  const parts = base ? base.split("/") : [];
  for (const seg of s.replace(/\\/g, "/").split("/")) {
    if (seg === "..") parts.pop(); else if (seg && seg !== ".") parts.push(seg);
  }
  return parts.join("/");
}
const tipUrl = path => "/tips/" + path.split("/").map(encodeURIComponent).join("/");
function mdInline(s, base) {
  const keep = [], put = html => `\u0000${keep.push(html) - 1}\u0000`;
  s = s.replace(/\u0000/g, "");
  s = s.replace(/`([^`]+)`/g, (_, c) => put(`<code>${esc(c)}</code>`));
  s = s.replace(/!\[([^\]]*)\]\(\s*<?([^)\s>]+)>?(?:\s+"[^"]*")?\s*\)/g, (_, alt, src) => {
    if (/^https?:\/\//i.test(src)) return put(`<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy">`);
    if (/^[a-z][a-z0-9+.-]*:/i.test(src) || !TIP_IMAGES.test(src)) return put(esc(alt));
    return put(`<img src="${esc(tipUrl(tipResolve(base, src)))}" alt="${esc(alt)}" loading="lazy">`);
  });
  s = s.replace(/\[([^\]]+)\]\(\s*<?([^)\s>]+)>?(?:\s+"[^"]*")?\s*\)/g, (_, text, href) => {
    if (/^https?:\/\//i.test(href)) return put(`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(text)}</a>`);
    if (/^[a-z][a-z0-9+.-]*:/i.test(href)) return put(esc(text));
    const path = tipResolve(base, href.split("#")[0]);
    if (TIP_KINDS.test(path)) return put(`<a href="#" data-tip="${esc(path)}">${esc(text)}</a>`);
    if (TIP_IMAGES.test(path)) return put(`<a href="${esc(tipUrl(path))}" target="_blank" rel="noopener">${esc(text)}</a>`);
    return put(esc(text));
  });
  s = s.replace(/https?:\/\/[^\s<>"'　-ヿ＀-￯]+[^\s<>"'.,;:!?)\]　-ヿ＀-￯]/g,
    url => put(`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>`));
  s = esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*(?!\s)([^*]*[^*\s])\*(?!\*)/g, "$1<em>$2</em>")
    .replace(/~~(.+?)~~/g, "<del>$1</del>")
    .replace(/==(.+?)==/g, "<mark>$1</mark>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => keep[+i]);
}
function mdToHtml(text, base, ctx = { h: 0 }) {
  const lines = text.replace(/\r\n?/g, "\n").replace(/\t/g, "    ").split("\n");
  const out = []; let para = [], i = 0;
  const flush = () => { if (para.length) { out.push(`<p>${para.map(l => mdInline(l, base)).join("<br>")}</p>`); para = []; } };
  const LIST = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/;
  const isSep = l => /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(l);
  const cells = l => {
    let s = l.trim(); if (s.startsWith("|")) s = s.slice(1); if (s.endsWith("|") && !s.endsWith("\\|")) s = s.slice(0, -1);
    return s.split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, "|"));
  };
  while (i < lines.length) {
    const l = lines[i];
    let m;
    if ((m = l.match(/^\s*(`{3,}|~{3,})/))) {             // コード
      flush(); const fence = m[1], code = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith(fence)) code.push(lines[i++]);
      i++; out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`); continue;
    }
    if (!l.trim()) { flush(); i++; continue; }
    if ((m = l.match(/^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/))) { // 見出し
      flush(); const n = m[1].length; out.push(`<h${n} id="tip-h-${ctx.h++}">${mdInline(m[2], base)}</h${n}>`); i++; continue;
    }
    if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(l)) { flush(); out.push("<hr>"); i++; continue; }
    if (l.includes("|") && i + 1 < lines.length && lines[i + 1].includes("-") && isSep(lines[i + 1])) { // 表
      flush();
      const head = cells(l), align = cells(lines[i + 1]).map(c => c.endsWith(":") ? (c.startsWith(":") ? "center" : "right") : "");
      const rows = []; i += 2;
      while (i < lines.length && lines[i].trim() && lines[i].includes("|")) rows.push(cells(lines[i++]));
      const td = (tag, c, k) => `<${tag}${align[k] ? ` style="text-align:${align[k]}"` : ""}>${mdInline(c, base).replace(/&lt;br\s*\/?&gt;/gi, "<br>")}</${tag}>`;
      out.push(`<div class="tablewrap"><table><thead><tr>${head.map((c, k) => td("th", c, k)).join("")}</tr></thead>
        <tbody>${rows.map(r => `<tr>${head.map((_, k) => td("td", r[k] || "", k)).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if (/^\s{0,3}>/.test(l)) {                               // 引用
      flush(); const q = [];
      while (i < lines.length && /^\s{0,3}>/.test(lines[i])) q.push(lines[i++].replace(/^\s{0,3}>\s?/, ""));
      out.push(`<blockquote>${mdToHtml(q.join("\n"), base, ctx)}</blockquote>`); continue;
    }
    if (LIST.test(l)) {                                      // 箇条書き(字下げで入れ子)
      flush(); const items = [];
      while (i < lines.length) {
        const x = lines[i], lm = x.match(LIST);
        if (lm) { items.push({ indent: lm[1].length, ordered: /\d/.test(lm[2]), start: parseInt(lm[2], 10) || 1, lines: [lm[3]] }); i++; continue; }
        if (x.trim() && /^\s{2,}/.test(x) && items.length) { items[items.length - 1].lines.push(x.trim()); i++; continue; }
        if (!x.trim() && i + 1 < lines.length && LIST.test(lines[i + 1])) { i++; continue; }
        break;
      }
      let html = ""; const stack = [];
      for (const it of items) {
        const tag = it.ordered ? "ol" : "ul";
        while (stack.length && it.indent < stack[stack.length - 1].indent) html += `</li></${stack.pop().tag}>`;
        const top = stack[stack.length - 1];
        if (!top || it.indent > top.indent) {
          html += `<${tag}${it.ordered && it.start !== 1 ? ` start="${it.start}"` : ""}>`; stack.push({ indent: it.indent, tag });
        } else {
          html += "</li>";
          if (top.tag !== tag) { html += `</${top.tag}><${tag}>`; top.tag = tag; }
        }
        let first = it.lines[0], cls = "";
        const task = first.match(/^\[([ xX])\]\s+(.*)$/);
        if (task) { cls = ' class="task"'; first = task[2]; }
        const body = [first, ...it.lines.slice(1)].map(x => mdInline(x, base)).join("<br>");
        html += `<li${cls}>${task ? `<input type="checkbox" disabled${task[1] !== " " ? " checked" : ""}>` : ""}${body}`;
      }
      while (stack.length) html += `</li></${stack.pop().tag}>`;
      out.push(html); continue;
    }
    para.push(l.trim()); i++;
  }
  flush();
  return out.join("\n");
}
/* 目次: API の toc(直下のメモとグループの並び)から描く。▲▼ で並べ替え(_order.json に保存) */
const tipMv = (list, i, n) => `<button type="button" class="mv" data-list="${esc(list)}" data-i="${i}" data-d="-1" aria-label="上へ" title="上へ"${i ? "" : " disabled"}>▲</button>`
  + `<button type="button" class="mv" data-list="${esc(list)}" data-i="${i}" data-d="1" aria-label="下へ" title="下へ"${i < n - 1 ? "" : " disabled"}>▼</button>`;
function renderTipsToc(heads = tipHeads) {
  if (!tipsList) return;

  const link = (t, inGrp, list, i, n) => {
    const cur = t.path === tipCur;
    return `<div class="ti"><a href="#" data-tip="${esc(t.path)}" class="${inGrp ? "in-grp" : ""}" aria-current="${cur}">${esc(t.title)}</a>${tipMv(list, i, n)}</div>`
      + (cur && heads ? `<div class="heads${inGrp ? " in-grp" : ""}">${heads}</div>` : "");
  };
  const html = toc.map((e, i) => e.type === "group"
    ? `<div class="grp"><span>${esc(e.label)}${e.items.length ? "" : `<span class="empty-grp">(空)</span>`}</span>${tipMv("top", i, toc.length)}</div>`
      + e.items.map((t, j) => link(t, true, "g:" + e.name, j, e.items.length)).join("")
    : link(e, false, "top", i, toc.length)).join("");

async function moveTip(list, i, d) {
  const toc = tipsList.toc, order = { top: [...tipsList.order.top], groups: { ...tipsList.order.groups } };
  const key = e => e.type === "group" ? e.name + "/" : e.path;
  const swap = arr => { const a = [...arr]; [a[i], a[i + d]] = [a[i + d], a[i]]; return a; };
  if (list === "top") order.top = swap(toc.map(key));  // 動かした一覧だけを差し替える(ほかは保存済みの並びのまま)
  else {
    const g = toc.find(e => e.type === "group" && "g:" + e.name === list); if (!g) return;
    order.groups[g.name] = swap(g.items.map(t => t.path.slice(g.name.length + 1)));
  }
  try { tipsList = await api("/api/tips/order", { method: "POST", body: order }); $("#tips-err").textContent = ""; }
  catch (e) { $("#tips-err").textContent = e.message; return; }
  renderTipsToc();
  $(`#tips-toc .mv[data-list="${CSS.escape(list)}"][data-i="${i + d}"][data-d="${d}"]`)?.focus();  // 続けて押せるように
}

async function openTip(path) {

/* 書き方の挿入。execCommand("insertText") を優先して Ctrl+Z で戻せるようにする */
function teReplace(ta, start, end, text, selStart = start + text.length, selEnd = selStart) {
  ta.focus(); ta.setSelectionRange(start, end);
  if (!document.execCommand("insertText", false, text)) ta.setRangeText(text, start, end, "end");
  ta.setSelectionRange(selStart, selEnd);
}
const TIP_TABLE = "| 項目 | 内容 |\n| --- | --- |\n|  |  |\n";
$("#tips-edit").querySelector(".te-tools").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const ta = $("#te-text"), v = ta.value, s = ta.selectionStart, en = ta.selectionEnd;
  if (b.dataset.line) {  // 選んだ行すべての行頭に入れる
    const ls = v.lastIndexOf("\n", s - 1) + 1, le = v.indexOf("\n", Math.max(en - (en > s && v[en - 1] === "\n" ? 1 : 0), s));
    const end = le < 0 ? v.length : le, block = v.slice(ls, end).split("\n").map(l => b.dataset.line + l).join("\n");
    teReplace(ta, ls, end, block, ls + block.length);
  } else if (b.dataset.block === "table") {  // カーソルの行が空ならそこへ、そうでなければ次の行へ
    const ls = v.lastIndexOf("\n", s - 1) + 1, le = v.indexOf("\n", s), end = le < 0 ? v.length : le;
    if (v.slice(ls, end).trim() === "") teReplace(ta, ls, end, TIP_TABLE.slice(0, -1), ls + 2, ls + 4);
    else teReplace(ta, end, end, "\n" + TIP_TABLE.slice(0, -1), end + 3, end + 5);
  } else if (b.dataset.wrap) {
    const w = b.dataset.wrap, sel = v.slice(s, en);
    teReplace(ta, s, en, w + sel + w, s + w.length, s + w.length + sel.length);
  } else if (b.dataset.ins) teReplace(ta, s, en, b.dataset.ins);
});

      ${m.score < 0.95 ? `<span class="check" title="読み取り: ${esc(m.read)}">要確認</span>` : ""}</li>`).join("")}</ol>` : ""}
    <div class="row"><button type="button" class="btn" id="ocr-apply">フォームにすべて反映(上書き)</button><span class="mini">${esc(msg)}</span></div>
    <p class="note">読み取りは推定です。保存前に内容を確認してください。フォーマの推定は「MOD が最大ランク」「極性が一致すると消費が半分になる」ことを使っており、元から付いている極性も1つと数えます。</p>`;
}
function applyOcr(r, onlyEmpty) {
  const filled = [];
  const set = (id, v, label, empty) => { if (v === null || v === undefined || v === "") return; if (!onlyEmpty || empty) { $(id).value = v; filled.push(label); } };
  const targetWasEmpty = !$("#b-target").value.trim();
  if (r.target) {
    set("#b-target", r.target.en, "対象", targetWasEmpty);
    set("#b-type", r.target.type, "種別", targetWasEmpty);
    set("#b-name", r.target.en, "ビルド名", !$("#b-name").value.trim());
  }
  const modList = r.mods.filter(m => m.kind !== "arcane"), arcList = r.mods.filter(m => m.kind === "arcane");
  if (modList.length) set("#b-mods", modList.map(m => m.en).join("\n"), "MOD", !$("#b-mods").value.trim());
  if (arcList.length) set("#b-arcanes", arcList.map(m => m.en).join("\n"), "アルケイン", !$("#b-arcanes").value.trim());
  // ゲーム内の表示から読めたフォーマ数はそのまま登録する。推定値は空欄(0)のときだけ入れる
  if (r.forma.value !== null) set("#b-forma", r.forma.value, "フォーマ", r.forma.source === "display" || !(+$("#b-forma").value));
  if (r.forma.polarized && r.forma.polarized.length) {
    const line = `極性(推定): ${polSummary(r.forma.polarized)}`;
    const note = $("#b-note").value.split("\n").filter(l => !l.startsWith("極性(推定):"));
    $("#b-note").value = [...note.filter(Boolean), line].join("\n"); filled.push("メモ(極性)");
  }
  return filled;
}
async function analyzeImages(list, auto) {
  if (!list.length) return;
  const info = await loadOcrInfo();
  if (!info.available) { if (!auto) { $("#b-ocr").hidden = false; $("#b-ocr").innerHTML = noData(info.reason || "文字認識が使えません。"); } return; }
  const run = ++ocrRun, btn = $("#b-analyze"), out = [];
  btn.disabled = true; $("#b-ocr").hidden = false;
  try {
    for (let i = 0; i < list.length; i++) {
      $("#b-ocr").innerHTML = `<span class="busy">画像を読み取り中... ${i + 1} / ${list.length}(1枚に数秒かかります)</span>`;
      const im = list[i];
      let r;
      if (im.saved) r = await api(`/api/build-analyze?image=${encodeURIComponent(im.saved)}`, { method: "POST", body: {} });
      else {
        const blob = im.blob.size > 18 * 1024 * 1024 ? await prepareImage(im.blob) : im.blob;
        const res = await fetch("/api/build-analyze", { method: "POST", headers: { "Content-Type": blob.type || "image/png" }, body: blob });
        r = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(r.error || `エラー (${res.status})`);
      }
      out.push(r);
    }
    if (run !== ocrRun) return;
    ocrResult = mergeOcr(out);
    const filled = auto ? applyOcr(ocrResult, true) : [];
    renderOcr(ocrResult, auto ? (filled.length ? `${filled.join("・")}を入力しました。入力済みの項目は、画面に表示されたフォーマ数を除いて変更していません。` : "入力済みの項目は変更していません。") : "");
  } catch (e) { if (run === ocrRun) $("#b-ocr").innerHTML = `<span class="err">読み取れませんでした: ${esc(e.message)}</span>`; }
  btn.disabled = false;
}
$("#b-analyze").addEventListener("click", () => analyzeImages(formImages, false));
$("#b-ocr").addEventListener("click", e => {
  if (!e.target.closest("#ocr-apply") || !ocrResult) return;
  const filled = applyOcr(ocrResult, false);
  renderOcr(ocrResult, `${filled.join("・")}を反映しました。保存ボタンで登録されます。`);
});

/** 大きい画像(4MB超)は縮小してから送る。GIF はアニメーションを壊さないようそのまま */
async function prepareImage(file) {
  if (file.size <= 4 * 1024 * 1024 || file.type === "image/gif" || !window.createImageBitmap) return file;
  try {
    const bmp = await createImageBitmap(file), scale = Math.min(1, 2560 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/webp", 0.92));
    return blob && blob.type === "image/webp" ? blob : await new Promise(r => c.toBlob(r, "image/jpeg", 0.92));
  } catch (e) { return file; }
}
function addImageFiles(files) {
  const ok = [...files].filter(f => /^image\/(png|jpeg|gif|webp)$/.test(f.type));
  if (!ok.length) { $("#b-err").textContent = "PNG / JPEG / GIF / WebP の画像を選んでください。"; return; }
  $("#b-err").textContent = "";
  const added = ok.map(f => ({ blob: f, url: URL.createObjectURL(f) }));
  formImages.push(...added);
  renderFormImages(); $("#build-form-wrap").open = true;
  analyzeImages(added, true);  // 追加した画像を自動で読み取り、空欄に入力する
}
function resetBuildForm() {
  editing = null; $("#build-form").reset(); $("#b-forma").value = 0; clearFormImages(); $("#b-arc-note").textContent = "";
  $("#build-form-title").textContent = "ビルドを追加"; $("#b-cancel").hidden = true; $("#b-err").textContent = "";
}
function renderBuilds() {
  const q = $("#b-filter").value.trim().toLowerCase(), t = $("#b-filter-type").value;
  const list = builds.filter(b => (!t || b.type === t) &&
    (!q || [b.name, b.target, ...(b.tags || []), ...(b.arcanes || [])].some(x => (x || "").toLowerCase().includes(q))));
  $("#build-list").innerHTML = list.length ? list.map(b => `
    <div class="card build"><header><b>${esc(b.name)}</b><span>${esc(btypes[b.type] || b.type)}${b.target ? " / " + esc(b.target) : ""}</span></header>
    <div class="pad"><div class="meta">フォーマ ${b.forma || 0} / MOD ${(b.mods || []).length}${(b.arcanes || []).length ? ` / アルケイン ${b.arcanes.length}` : ""}${(b.images || []).length ? ` / 画像 ${b.images.length}` : ""}</div>
      ${(b.mods || []).length ? `<ol>${b.mods.map(m => `<li>${esc(m)}</li>`).join("")}</ol>` : ""}
      ${(b.arcanes || []).length ? `<div class="arcs"><span class="mini">アルケイン</span> ${b.arcanes.map(a => `<span class="arc">${esc(a)}</span>`).join("")}</div>` : ""}
      ${b.note ? `<div>${esc(b.note)}</div>` : ""}
      ${(b.tags || []).length ? `<div class="tags">${b.tags.map(x => `<span>#${esc(x)}</span>`).join("")}</div>` : ""}
      ${(b.images || []).length ? `<div class="thumbs">${b.images.map((n, i) => `<button type="button" class="thumb" data-view-img="${esc(b.name)}" data-i="${i}" aria-label="${esc(b.name)} の画像 ${i + 1} を拡大"><img src="${imgUrl(n)}" alt="" loading="lazy"></button>`).join("")}</div>` : ""}
      <div class="acts"><button class="btn ghost" data-edit="${esc(b.name)}">編集</button>
        <button class="btn danger${armed === b.name ? " armed" : ""}" data-del="${esc(b.name)}">${armed === b.name ? "本当に削除" : "削除"}</button></div></div></div>`).join("")
    : `<div class="empty">${builds.length ? "条件に合うビルドがありません。" : "まだビルドがありません。上のフォームから追加してください。"}</div>`;
}
let arcaneNames = [];
const ARC_LIMIT = { frame: 2, primary: 1, secondary: 1, melee: 1 };  // ゲーム内で装備できる数
function arcNote() {
  const lines = $("#b-arcanes").value.split("\n").map(x => x.trim()).filter(Boolean);
  const limit = ARC_LIMIT[$("#b-type").value], known = new Set(arcaneNames.map(a => a.toLowerCase()));
  const unknown = lines.filter(a => known.size && !known.has(a.toLowerCase()));
  const msgs = [];
  if (limit && lines.length > limit) msgs.push(`${btypes[$("#b-type").value]}に装備できるアルケインは ${limit} つまでです(いま ${lines.length} つ)。`);
  if (unknown.length) msgs.push(`一覧に無い名前: ${unknown.join(", ")}`);
  $("#b-arc-note").textContent = msgs.join(" ");
  $("#b-arc-note").classList.toggle("err", msgs.length > 0);
}
function addArcane() {
  const v = $("#b-arc-pick").value.trim(); if (!v) return;
  const hit = arcaneNames.find(a => a.toLowerCase() === v.toLowerCase()) || v;
  const lines = $("#b-arcanes").value.split("\n").map(x => x.trim()).filter(Boolean);
  if (!lines.some(x => x.toLowerCase() === hit.toLowerCase())) lines.push(hit);
  $("#b-arcanes").value = lines.join("\n"); $("#b-arc-pick").value = ""; arcNote();
}
$("#b-arc-add").addEventListener("click", addArcane);
$("#b-arc-pick").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addArcane(); } });
$("#b-arcanes").addEventListener("input", arcNote);
$("#b-type").addEventListener("change", arcNote);
async function loadBuilds() {
  const r = await api("/api/builds"); builds = r.builds; btypes = r.types;
  arcaneNames = r.arcanes || [];
  $("#arcane-list").innerHTML = arcaneNames.map(a => `<option value="${esc(a)}">`).join("");
  $("#b-type").innerHTML = Object.entries(btypes).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("");
  const cur = $("#b-filter-type").value;
  $("#b-filter-type").innerHTML = `<option value="">すべての種別</option>` + Object.entries(btypes).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("");
  $("#b-filter-type").value = cur; renderBuilds();
}
$("#build-form").addEventListener("submit", async e => {
  e.preventDefault(); $("#b-err").textContent = "";
  const btn = $("#b-save"), name = $("#b-name").value.trim();
  btn.disabled = true;
  try {
    const r = await api("/api/builds", { method: "POST", body: {
      original_name: editing, name, type: $("#b-type").value, target: $("#b-target").value,
      forma: $("#b-forma").value, mods: $("#b-mods").value, arcanes: $("#b-arcanes").value, tags: $("#b-tags").value, note: $("#b-note").value,
      images: formImages.filter(i => i.saved).map(i => i.saved) } });
    builds = r.builds;
    // ビルドを保存してから、新しい画像を1枚ずつ送る
    editing = name;
    const pending = formImages.filter(i => !i.saved);
    for (let k = 0; k < pending.length; k++) {
      $("#b-err").textContent = `画像を保存中... ${k + 1} / ${pending.length}`;
      const blob = await prepareImage(pending[k].blob);
      const res = await fetch(`/api/build-image?name=${encodeURIComponent(name)}`, { method: "POST", headers: { "Content-Type": blob.type || "image/png" }, body: blob });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(`画像 ${k + 1} を保存できませんでした: ${data.error || res.status}(ビルド本体は保存済みです)`);
      builds = data.builds;
      pending[k].saved = data.builds.find(x => x.name === name).images.slice(-1)[0];
      URL.revokeObjectURL(pending[k].url); delete pending[k].url; delete pending[k].blob;
    }
    resetBuildForm(); renderBuilds();
  } catch (err) { $("#b-err").textContent = err.message; renderFormImages(); renderBuilds(); }
  btn.disabled = false;
});
/* 画像の追加: クリック / ドラッグ&ドロップ / 貼り付け */
$("#b-drop").addEventListener("click", () => $("#b-file").click());
$("#b-drop").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("#b-file").click(); } });
$("#b-file").addEventListener("change", e => { addImageFiles(e.target.files); e.target.value = ""; });
["dragenter", "dragover"].forEach(t => $("#b-drop").addEventListener(t, e => { e.preventDefault(); $("#b-drop").classList.add("over"); }));
["dragleave", "drop"].forEach(t => $("#b-drop").addEventListener(t, () => $("#b-drop").classList.remove("over")));
$("#b-drop").addEventListener("drop", e => { e.preventDefault(); addImageFiles(e.dataTransfer.files); });
document.addEventListener("paste", e => {
  if ($("#view-build").hidden) return;
  const files = [...(e.clipboardData ? e.clipboardData.files : [])].filter(f => f.type.startsWith("image/"));
  if (!files.length) return;
  e.preventDefault(); addImageFiles(files);
});
$("#b-thumbs").addEventListener("click", e => {
  const rm = e.target.closest("[data-rm]");
  if (rm) { const [im] = formImages.splice(+rm.dataset.rm, 1); if (im.url) URL.revokeObjectURL(im.url); renderFormImages(); return; }
  const t = e.target.closest(".thumb"); if (!t) return;
  openLightbox(formImages.map(im => im.saved ? imgUrl(im.saved) : im.url), +t.dataset.i);
});
/* 拡大表示 */
let lb = { urls: [], i: 0 };
function showLightbox() {
  const n = lb.urls.length; $("#lb-img").src = lb.urls[lb.i]; $("#lb-open").href = lb.urls[lb.i];
  $("#lb-count").textContent = `${lb.i + 1} / ${n}`; $("#lb-prev").disabled = $("#lb-next").disabled = n < 2;
}
function openLightbox(urls, i) { lb = { urls, i }; showLightbox(); $("#lightbox").showModal(); }
const lbMove = d => { lb.i = (lb.i + d + lb.urls.length) % lb.urls.length; showLightbox(); };
$("#lb-prev").addEventListener("click", () => lbMove(-1));
$("#lb-next").addEventListener("click", () => lbMove(1));
$("#lb-close").addEventListener("click", () => $("#lightbox").close());
$("#lightbox").addEventListener("click", e => { if (e.target.id === "lightbox") $("#lightbox").close(); });
$("#lightbox").addEventListener("keydown", e => { if (e.key === "ArrowLeft") lbMove(-1); if (e.key === "ArrowRight") lbMove(1); });
$("#b-cancel").addEventListener("click", resetBuildForm);
$("#b-filter").addEventListener("input", renderBuilds);
$("#b-filter-type").addEventListener("change", renderBuilds);
$("#build-list").addEventListener("click", async e => {
  const ed = e.target.closest("[data-edit]"), del = e.target.closest("[data-del]"), view = e.target.closest("[data-view-img]");
  if (view) {
    const b = builds.find(x => x.name === view.dataset.viewImg);
    if (b) openLightbox(b.images.map(imgUrl), +view.dataset.i);
    return;
  }
  if (ed) {
    const b = builds.find(x => x.name === ed.dataset.edit); if (!b) return;
    editing = b.name; $("#b-name").value = b.name; $("#b-type").value = b.type; $("#b-target").value = b.target || "";
    $("#b-forma").value = b.forma || 0; $("#b-mods").value = (b.mods || []).join("\n"); $("#b-arcanes").value = (b.arcanes || []).join("\n"); $("#b-tags").value = (b.tags || []).join(",");
    $("#b-note").value = b.note || ""; $("#build-form-title").textContent = `「${b.name}」を編集`; $("#b-cancel").hidden = false;
    clearFormImages(); formImages = (b.images || []).map(n => ({ saved: n })); renderFormImages();
    $("#build-form-wrap").open = true; $("#b-name").focus(); window.scrollTo({ top: 0, behavior: "smooth" });
  } else if (del) {
    const name = del.dataset.del;
    if (armed !== name) { armed = name; renderBuilds(); setTimeout(() => { if (armed === name) { armed = null; renderBuilds(); } }, 4000); return; }
    armed = null;
    try { builds = (await api(`/api/builds?name=${encodeURIComponent(name)}`, { method: "DELETE" })).builds; if (editing === name) resetBuildForm(); renderBuilds(); }
    catch (err) { $("#b-err").textContent = err.message; }
  }
});
loaders.build = () => { loadOcrInfo(); return loadBuilds().catch(e => { $("#build-list").innerHTML = noData(e.message); }); };

/* ---------- データ更新 ---------- */
$("#update-btn").addEventListener("click", async () => {
  const btn = $("#update-btn"), log = $("#update-log");
  btn.disabled = true; btn.textContent = "取得中..."; log.hidden = false; log.textContent = "取得しています。数十秒かかることがあります...";
  try {
    const r = await api("/api/update", { method: "POST", body: {} });
    log.textContent = r.log || (r.ok ? "完了しました。" : "失敗しました。");
    itemSearch.reset(); partSearch.reset(); mods = null; rivens = null; modOpen = null; mastery = null; arcanes = null;
    simReload();  // シミュレータ用データも「データ更新」で作り直すので、開いていれば読み直す
  } catch (e) { log.textContent = e.message; }
  btn.disabled = false; btn.textContent = "公式データを取得"; refreshStatus();
});
loaders.update = refreshStatus;

/* ---------- トップ・ページ説明 ---------- */
/* どちらも MENU から組み立てる(ページを足すと自動で載る)。ノンカテゴリのページ(トップ自身を除く)は「その他」にまとめる */
function menuSections() {
  const out = [], other = [];
  MENU.forEach(e => {
    if (e.group) {
      const items = e.items.filter(pageExists);
      if (items.length) out.push({ label: t("group." + e.group), items });
    } else if (e.page !== "home" && pageExists(e.page)) other.push(e.page);
  });
  if (other.length) out.push({ label: t("group.other"), items: other });
  return out;
}
function applyViewText(id) {
  document.querySelectorAll(`#view-${id} [data-i18n]`).forEach(el => { el.textContent = t(el.dataset.i18n); });
}
function renderHome() {
  applyViewText("home");
  $("#home-cards").innerHTML = menuSections().map(s => `<div class="card"><header><b>${esc(s.label)}</b></header>${
    s.items.map(v => `<button type="button" class="go" data-go="${esc(v)}"><b>${esc(t("page." + v))}</b><span>${esc(t("page." + v + ".sub"))}</span></button>`).join("")}</div>`).join("");
}
function renderGuide() {
  applyViewText("guide");
  $("#guide-list").innerHTML = menuSections().map(s => `<h3 class="guide-h">${esc(s.label)}</h3><div class="cards">${
    s.items.filter(v => v !== "guide").map(v => `<div class="card"><header><b>${esc(t("page." + v))}</b><button type="button" class="btn ghost guide-go" data-go="${esc(v)}">${esc(t("guide.open"))}</button></header><p class="guide-text">${esc(t("guide." + v))}</p></div>`).join("")}</div>`).join("");
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (b) { show(b.dataset.go); window.scrollTo(0, 0); }
});
loaders.home = renderHome;
loaders.guide = renderGuide;

/* ---------- 起動 ---------- */
(async () => {
  const s = await refreshStatus();
  let v = "home";  // 初めて開いたとき(前回のページの記録が無いとき)はトップ
  try { v = localStorage.getItem("wf-view") || "home"; } catch (e) {}
  if (!views.includes(v)) v = "home";
  show(s && !s.has_drops ? "update" : v);
})();
