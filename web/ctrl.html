<!doctype html>
<html lang="ja">
<head>
<!-- 基礎部: 文書の骨組みとコントローラー(基礎スクリプト・起動)。サーバー(wfp/api/pages.py)が
     INCLUDE の目印に web/view.html(全体の CSS)・web/i18n.html(文字を引く部品)・web/menu.html(メニュー部)・
     web/parts.html(画面の共通部品)・web/pages/<id>.html(ページごとの表示部と処理。pages#… は PAGE_FILES の順に全部)を差し込んで1枚のページにする -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ICON:HEAD:START -->
<!-- 既定はオリジナルの図形。公式ロゴは同梱せず、取得済みならヘッダーに表示する(下の applyLogo) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%230c1114'/%3E%3Cg transform='translate(4 14) scale(.875)' fill='%2380d9e2'%3E%3Cpath fill-rule='evenodd' d='M32 2 60 20 32 38 4 20Z M32 9 49 20 32 31 15 20Z'/%3E%3Cpath d='M32 14 41 20 32 26 23 20Z'/%3E%3C/g%3E%3C/svg%3E">
<!-- ICON:HEAD:END -->

<!-- INCLUDE:pages#style -->

<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="logo" role="img" aria-label="Warframe Portal"></span>
      <div><h1>Warframe Portal</h1></div>
      <small class="ver" id="app-ver"></small>
    </div>
    <div class="spacer"></div>
    <!-- β版の機能を使うかどうか(web/menu.html の renderBetaSwitch・setBeta。説明は title に出す) -->
    <label class="beta-sw" id="beta-sw-box" data-i18n-title="home.beta.note"><input type="checkbox" id="beta-sw"> <span data-i18n="home.beta">β版の機能を使う</span></label>
    <!-- 言語の切り替え(ボタンは web/menu.html の renderLangSwitch が I18N の言語から作る) -->
    <div class="lang-sw" id="lang-sw" role="group" hidden></div>
    <span class="pill" id="status-pill" aria-live="polite">データ確認中...</span>
  </header>

  <div class="body">
    <!-- メニューの中身は web/menu.html の MENU(並び)と I18N(表示する文字)から作る -->
    <nav id="nav" aria-label="メニュー"></nav>

    <main>
<!-- INCLUDE:pages#view -->
    </main>
  </div>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
/** 表示画面(main)を先頭などへスクロールする。広い画面は main だけがスクロールし、狭い画面はページ全体なので両方に効かせる */
function scrollView(opt = { top: 0 }) {
  $("main")?.scrollTo(opt);
  window.scrollTo(opt);
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(path, opts = {}) {
  const init = { method: opts.method || "GET", headers: {} };
  if (opts.body !== undefined) { init.headers["Content-Type"] = "application/json"; init.body = JSON.stringify(opts.body); }
  return apiRead(await apiFetch(path, init));  // 届かないとき・エラーの文の決め方は i18n.html の apiFetch・apiRead
}
/* Python の定数(wfp/core/const。差し込む名前は wfp/api/pages.py の PAGE_CONSTS)。画面で手で写さない */
const CONST = /* CONST:DATA */ {};
/* 入力欄の Enter(確定の操作)かどうか。日本語などの変換を確定する Enter は数えない
   (isComposing。Safari は変換の確定で isComposing が false のまま届くので keyCode 229 も見る) */
const isEnter = e => e.key === "Enter" && !e.isComposing && e.keyCode !== 229;
const debounce = (fn, ms = 180) => { let timer; return (...a) => { clearTimeout(timer); timer = setTimeout(() => fn(...a), ms); }; };
const pct = x => x.toFixed(2) + "%";
const dur = sec => {
  sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const p = n => String(n).padStart(2, "0");
  return h ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
};
/* レア度(キーは Common など)・入手先の種類(キーは mission など)の札。文字は I18N の rarity.<キー> / src.cat.<キー> */
const rarity = key => `<span class="rar ${esc(key)}">${esc(tName("rarity.", key))}</span>`;
const noData = msg => `<div class="empty">${esc(msg)}</div>`;
const catTag = (key, label) => `<span class="cat ${esc(key)}">${esc(label != null ? label : tName("src.cat.", key))}</span>`;
const fmtPct = x => x >= 1 ? x.toFixed(2) + "%" : x >= 0.01 ? x.toFixed(3) + "%" : x.toPrecision(2) + "%";
/** 見出しクリックで並べ替える表 (state = {key, dir}) */
function sortRows(rows, state, getters) {
  const g = getters[state.key]; if (!g) return rows;
  const dir = state.dir === "asc" ? 1 : -1;
  return rows.slice().sort((a, b) => {
    const x = g(a), y = g(b);
    if (x === y) return 0;
    if (x === null || x === undefined) return 1;
    if (y === null || y === undefined) return -1;
    return (typeof x === "string" ? x.localeCompare(y, locale()) : x - y) * dir;  // 文字は表示中の言語の並び(i18n.html の locale)
  });
}
/* 並べ替えできる見出し: <th scope="col"> の中の <button> を押す(Enter・Space も button が受ける)。
   aria-sort は並べ替え中の列にだけ付ける(ほかの列には付けない)。cls = th のクラス(chk・num)、attrs = th に足す属性(rowspan など) */
const th = (label, key, state, cls = "", attrs = "") =>
  `<th scope="col" class="sort ${cls}"${attrs ? " " + attrs : ""}${state.key === key ? ` aria-sort="${state.dir === "asc" ? "ascending" : "descending"}"` : ""}><button type="button" data-sort="${key}">${label}</button></th>`;
function onSortClick(container, state, render, numericKeys = []) {
  container.addEventListener("click", e => {
    const btn = e.target.closest("button[data-sort]"); if (!btn) return;
    const key = btn.dataset.sort;
    if (state.key === key) state.dir = state.dir === "asc" ? "desc" : "asc";
    else { state.key = key; state.dir = numericKeys.includes(key) ? "desc" : "asc"; }
    render();
    // 表を描き直すとボタンも作り直されるので、同じ列のボタンにフォーカスを戻す(キーボードで続けて押せるように)
    const again = container.querySelector(`button[data-sort="${CSS.escape(key)}"]`);
    if (again) again.focus({ preventScroll: true });
  });
}

</script>
<!-- INCLUDE:i18n.html#script -->
<!-- INCLUDE:menu.html#script -->
<script>
/* ---------- ロゴ ---------- */
/* 公式ファンキットのロゴは同梱していない。各自の PC に取得済み(初回起動時に自動取得)ならヘッダーに使う */
let logoApplied = false;
function applyLogo() {
  if (logoApplied) return;
  logoApplied = true;
  const img = new Image();
  img.onload = () => {
    const root = document.documentElement.style;
    root.setProperty("--logo-url", "url(/logo.png)");
    if (img.naturalHeight) root.setProperty("--logo-ratio", (img.naturalWidth / img.naturalHeight).toFixed(4));
  };
  img.onerror = () => { logoApplied = false; };
  img.src = "/logo.png";
}

/* ---------- ステータス ---------- */
let hasData = false;
async function refreshStatus() {
  const pill = $("#status-pill");
  try {
    const s = await api("/api/status");
    hasData = s.has_drops;
    if (s.version) $("#app-ver").textContent = `v${s.version}`;
    if (s.has_logo) applyLogo();
    pill.classList.toggle("warn", !s.has_drops);
    lastStatus = s; renderStatus();
    return s;
  } catch (e) { lastStatus = null; pill.dataset.state = "offline"; pill.textContent = t("status.offline"); pill.classList.add("warn"); }
}
/* ヘッダーのデータの状態と、データ更新ページの一覧(言語を切り替えたら描き直す) */
let lastStatus = null;
function renderStatus() {
  const pill = $("#status-pill"), s = lastStatus;
  if (!s) { pill.textContent = t(pill.dataset.state === "offline" ? "status.offline" : "status.checking"); return; }
  pill.textContent = s.has_drops ? fmt("status.data", { at: s.drops_updated, n: s.counts.items }) : t("status.nodata");
  const row = (k, v) => `<dt>${esc(t(k))}</dt><dd>${esc(v)}</dd>`;
  $("#update-info").innerHTML = s.has_drops
    ? row("upd.drops", fmt("upd.drops.v", { at: s.drops_updated, nodes: s.counts.nodes, items: s.counts.items }))
      + row("upd.extra", s.extra_files ? fmt("upd.extra.v", { at: s.extra_updated, files: s.extra_files, total: s.extra_total, n: s.counts.sources.toLocaleString(locale()) }) : t("upd.none"))
      + row("upd.riven", s.rivens_updated ? fmt("upd.riven.v", { at: s.rivens_updated, n: s.rivens_count }) : t("upd.none"))
      + row("upd.names", s.has_names ? fmt("upd.names.v", { at: (s.names_updated || "").replace("T", " ").replace("+00:00", " UTC") })
        + (s.names_source ? fmt("upd.names.src", { src: tName("export.src.", s.names_source), n: s.counts.mods }) : "") : t("upd.names.none"))
    : row("upd.state", t("upd.empty"));
}

/* ページのマークアップの文字を表示中の言語にする(決まりは web/i18n.html の applyText) */
function applyViewText(id) { const root = $(`#view-${id}`); if (root) applyText(root); }
/* データ更新のあとに捨てる、ページが手元に持っているデータ(ページの id → 関数。次に開いたときに読み直す)。データ更新のページが全部呼ぶ */
const dataResets = {};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (b) { show(b.dataset.go); scrollView(); }
});

<!-- INCLUDE:parts.html#script -->
<!-- INCLUDE:pages#script -->

/* ---------- 起動 ---------- */
(async () => {
  const s = await refreshStatus();
  let v = pref.get("wf-view", "home");  // 初めて開いたとき(前回のページの記録が無いとき)はトップ
  if (!views.includes(v)) v = "home";  // 今は無いページの記録(前の版の id など)もトップ
  show(s && !s.has_drops ? "update" : v);
})();
</script>
<div class="unofficial" role="note" lang="ja">非公式ファンツール <span lang="en">/ Unofficial fan tool</span></div>
</body>
</html>
