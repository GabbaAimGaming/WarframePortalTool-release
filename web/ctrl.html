<!-- 基礎部: 文書の骨組みとコントローラー(基礎スクリプト・各ページの処理・起動)。サーバー(wfp/api/pages.py)が
     INCLUDE の目印に web/view.html(表示部)・web/i18n.html(文字を引く部品)・web/menu.html(メニュー部)を差し込んで1枚のページにする。 -->

  <div class="body">

    <nav id="nav" aria-label="メニュー"></nav>

    <main>
<!-- INCLUDE:view.html#sections -->

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(path, opts = {}) {
  const init = { method: opts.method || "GET", headers: {} };
  if (opts.body !== undefined) { init.headers["Content-Type"] = "application/json"; init.body = JSON.stringify(opts.body); }
  const res = await fetch(path, init);
  const data = await res.json().catch(() => ({}));
  // エラーの文: テキスト指定(text)があれば表示中の言語で、無ければ日本語の文(error)のまま(多言語対応の済んでいない API)
  if (!res.ok) { const e = new Error(data.text ? renderTxt(data.text) : (data.error || fmt("err.http", { status: res.status }))); e.status = res.status; throw e; }
  return data;
}
const debounce = (fn, ms = 180) => { let timer; return (...a) => { clearTimeout(timer); timer = setTimeout(() => fn(...a), ms); }; };
const pct = x => x.toFixed(2) + "%";
const dur = sec => {
  sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const p = n => String(n).padStart(2, "0");
  return h ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
};
/* レア度(キーは Common など)・入手先の種類(キーは mission など)の札。文字は I18N の rarity.<キー> / src.cat.<キー> */
const rarity = key => `<span class="rar ${esc(key)}">${esc(tName("rarity.", key))}</span>`;
const noData = msg => `<div class="empty">${esc(msg)}</div>`;
const catTag = (key, label) => `<span class="cat ${esc(key)}">${esc(label != null ? label : tName("src.cat.", key))}</span>`;
const fmtPct = x => x >= 1 ? x.toFixed(2) + "%" : x >= 0.01 ? x.toFixed(3) + "%" : x.toPrecision(2) + "%";
/** 見出しクリックで並べ替える表 (state = {key, dir}) */
function sortRows(rows, state, getters) {
  const g = getters[state.key]; if (!g) return rows;
  const dir = state.dir === "asc" ? 1 : -1;
  return rows.slice().sort((a, b) => {
    const x = g(a), y = g(b);
    if (x === y) return 0;
    if (x === null || x === undefined) return 1;
    if (y === null || y === undefined) return -1;
    return (typeof x === "string" ? x.localeCompare(y, "ja") : x - y) * dir;
  });
}
const th = (label, key, state, cls = "") =>
  `<th class="sort ${cls}" data-sort="${key}" aria-sort="${state.key === key ? (state.dir === "asc" ? "ascending" : "descending") : "none"}" tabindex="0">${label}</th>`;
function onSortClick(container, state, render, numericKeys = []) {
  const handler = e => {
    const h = e.target.closest("th[data-sort]"); if (!h) return;
    if (e.type === "keydown" && e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault();
    const k = h.dataset.sort;
    if (state.key === k) state.dir = state.dir === "asc" ? "desc" : "asc";
    else { state.key = k; state.dir = numericKeys.includes(k) ? "desc" : "asc"; }
    render();
  };
  container.addEventListener("click", handler); container.addEventListener("keydown", handler);
}

</script>
<!-- INCLUDE:i18n.html#script -->
<!-- INCLUDE:menu.html#script -->
<script>
/* ---------- ロゴ ---------- */
/* 公式ファンキットのロゴは同梱していない。各自の PC に取得済み(初回起動時に自動取得)ならヘッダーに使う */
let logoApplied = false;
function applyLogo() {
  if (logoApplied) return;
  logoApplied = true;
  const img = new Image();
  img.onload = () => {
    const root = document.documentElement.style;
    root.setProperty("--logo-url", "url(/logo.png)");
    if (img.naturalHeight) root.setProperty("--logo-ratio", (img.naturalWidth / img.naturalHeight).toFixed(4));
  };
  img.onerror = () => { logoApplied = false; };
  img.src = "/logo.png";
}

/* ---------- ステータス ---------- */
let hasData = false;
async function refreshStatus() {
  const pill = $("#status-pill");
  try {
    const s = await api("/api/status");
    hasData = s.has_drops;
    if (s.version) $("#app-ver").textContent = `v${s.version}`;
    if (s.has_logo) applyLogo();
    pill.classList.toggle("warn", !s.has_drops);
    lastStatus = s; renderStatus();
    return s;
  } catch (e) { lastStatus = null; pill.dataset.state = "offline"; pill.textContent = t("status.offline"); pill.classList.add("warn"); }
}
/* ヘッダーのデータの状態と、データ更新ページの一覧(言語を切り替えたら描き直す) */
let lastStatus = null;
function renderStatus() {
  const pill = $("#status-pill"), s = lastStatus;
  if (!s) { pill.textContent = t(pill.dataset.state === "offline" ? "status.offline" : "status.checking"); return; }
  pill.textContent = s.has_drops ? fmt("status.data", { at: s.drops_updated, n: s.counts.items }) : t("status.nodata");
  const row = (k, v) => `<dt>${esc(t(k))}</dt><dd>${esc(v)}</dd>`;
  $("#update-info").innerHTML = s.has_drops
    ? row("upd.drops", fmt("upd.drops.v", { at: s.drops_updated, nodes: s.counts.nodes, items: s.counts.items }))
      + row("upd.extra", s.extra_files ? fmt("upd.extra.v", { at: s.extra_updated, files: s.extra_files, total: s.extra_total, n: s.counts.sources.toLocaleString(locale()) }) : t("upd.none"))
      + row("upd.riven", s.rivens_updated ? fmt("upd.riven.v", { at: s.rivens_updated, n: s.rivens_count }) : t("upd.none"))
      + row("upd.names", s.has_names ? fmt("upd.names.v", { at: (s.names_updated || "").replace("T", " ").replace("+00:00", " UTC") })
        + (s.names_source ? fmt("upd.names.src", { src: tName("export.src.", s.names_source), n: s.counts.mods }) : "") : t("upd.names.none"))
    : row("upd.state", t("upd.empty"));
}

/* ---------- 入手先の検索(素材から探す・パーツ検索で共用) ---------- */
/** 入手先の名前。敵の行(API の enemy に英名)は押すと敵から探すで開く(openEnemy) */
const placeCell = x => x.enemy
  ? `<button type="button" class="go-enemy" data-enemy="${esc(x.enemy)}" title="${esc(t("enemy.open"))}">${esc(x.enemy)}</button>`
  : esc(renderTxt(x.place));
/** 入手先の表 (素材から探す / パーツ検索 / MOD 一覧の詳細で共用)。行の place・detail・stage は API のテキスト指定 */
function sourceTable(rows) {
  const max = Math.max(...rows.map(x => x.chance ?? 0), 0.0001);  // 確率の無い入手先(クラン研究)は「—」でバーを出さない
  return `<div class="tablewrap"><table>
    <thead><tr>${["cat", "place", "detail", "stage", "chance", "rarity"].map(c => `<th>${esc(t("src.col." + c))}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(x => `<tr><td>${catTag(x.cat)}</td><td>${placeCell(x)}${x.event ? `<span class="tag-event">${esc(t("src.event"))}</span>` : ""}</td>
      <td>${esc(renderTxt(x.detail))}</td><td>${esc(renderTxt(x.stage))}</td>
      <td>${x.chance == null ? "—" : `<div class="chance"><div class="bar"><i style="--w:${(x.chance / max * 100).toFixed(1)}%"></i></div><b>${x.qty ? esc(fmt("src.qty", { n: x.qty })) : ""}${fmtPct(x.chance)}</b></div>`}</td>
      <td>${x.rarity ? rarity(x.rarity) : ""}</td></tr>`).join("")}</tbody></table></div>`;
}
/**
 * 名前で候補を出し、選んだ項目の入手先(/api/item)を表にするページを作る。部品は #<id>-q #<id>-chips #<id>-out #<id>-ev
 * o.id: ページの id / o.suggest(q): 候補を取る URL / o.list(res): 応答から候補の配列を取り出す(既定は応答そのもの)
 * o.onSuggest(res): 候補を受け取ったとき(カテゴリーの描画など。o.blocked で止めたときは null) / o.more(res, list): 候補の後ろに足す HTML / o.tag(item): 候補の名前の後ろに足す HTML(種類のラベルなど)
 * o.blocked(): 候補を取らずに止めるときの文字(例: 種類を1つも選んでいない)。止めないときは "" を返す(省略可)
 * o.msg: noMatch(res) 候補なし / pick 候補から選ぶ / empty 何も入っていない / noData データなし(どれも文字を返す関数)
 * 返り値: load(ページを開いたとき) / search(autoPick)(候補を取り直す) / reset(データ更新の後)
 */
function sourceSearch(o) {
  const el = part => $(`#${o.id}-${part}`);
  const list = o.list || (res => res);
  let key = null, cat = "", data = null;
  // 候補の名前: 日本語の画面は日本語名(下に英名)、ほかの言語は英名(ゲームの名前は Export の英語・日本語の2つだけ)
  const nameOf = i => (lang === "ja" ? i.ja : i.en), subOf = i => (lang === "ja" && i.ja !== i.en ? i.en : "");
  const chip = i => `<button class="chip" data-key="${esc(i.key)}" aria-pressed="${i.key === key}">${esc(nameOf(i))}${subOf(i) ? `<small>${esc(subOf(i))}</small>` : ""}${o.tag ? o.tag(i) : ""}</button>`;
  async function loadChips() {
    const stop = o.blocked ? o.blocked() : "";
    if (stop) { el("chips").innerHTML = `<span class="note">${esc(stop)}</span>`; if (o.onSuggest) o.onSuggest(null); return []; }
    try {
      const res = await api(o.suggest(el("q").value)), items = list(res);
      if (o.onSuggest) o.onSuggest(res);
      el("chips").innerHTML = items.length ? items.map(chip).join("") + (o.more ? o.more(res, items) : "")
        : `<span class="note">${esc(o.msg.noMatch(res))}</span>`;
      return items;
    } catch (e) { el("chips").innerHTML = ""; el("out").innerHTML = noData(e.message); return []; }
  }
  function renderResult() {
    const r = data; if (!r) return;
    if (cat && !r.cats.some(c => c.key === cat)) cat = "";
    const rows = cat ? r.rows.filter(x => x.cat === cat) : r.rows;
    el("out").innerHTML = `
    <div class="result-head"><h3>${esc(nameOf(r))}</h3>${subOf(r) ? `<span class="en">${esc(subOf(r))}</span>` : ""}<span class="count">${esc(fmt("src.count", { n: r.total }))}</span></div>
    ${r.cats.length > 1 ? `<div class="seg" role="group" aria-label="${esc(t("src.cats"))}">
      <button class="chip" data-cat="" aria-pressed="${!cat}">${esc(t("src.all"))}<small>${r.total}</small></button>
      ${r.cats.map(c => `<button class="chip" data-cat="${esc(c.key)}" aria-pressed="${cat === c.key}">${esc(tName("src.cat.", c.key))}<small>${c.n}</small></button>`).join("")}</div>` : ""}
    ${sourceTable(rows)}
    <p class="note">${esc(t("src.footnote"))}</p>`;
  }
  async function loadResult() {
    if (!key) { el("out").innerHTML = ""; return; }
    try {
      data = await api(`/api/item?key=${encodeURIComponent(key)}&events=${el("ev").checked ? 1 : 0}`);
      renderResult();
    } catch (e) { data = null; el("out").innerHTML = noData(e.message); }
  }
  const markChips = () => el("chips").querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.key === key));
  async function search(autoPick) {
    const items = await loadChips();
    if (!items || !items.length) { key = null; el("out").innerHTML = ""; return; }
    const q = el("q").value.trim();
    if (autoPick || !items.some(i => i.key === key)) {
      const exact = q && items.find(i => [i.ja, i.en].some(n => n.toLowerCase() === q.toLowerCase()));
      key = exact ? exact.key : (q && items.length === 1 ? items[0].key : (q ? null : key));
      if (key) markChips();
    }
    if (!key) el("out").innerHTML = `<div class="empty">${esc(q ? o.msg.pick() : o.msg.empty())}</div>`;
    else await loadResult();
  }
  el("out").addEventListener("click", e => {
    const c = e.target.closest("[data-cat]"); if (!c) return;
    cat = c.dataset.cat; renderResult();
  });
  el("q").addEventListener("input", debounce(() => search(true)));
  el("ev").addEventListener("change", loadResult);
  el("chips").addEventListener("click", e => {
    const c = e.target.closest(".chip[data-key]"); if (!c) return;
    key = c.dataset.key; cat = "";
    markChips();
    loadResult();
  });
  return {
    search,
    async load() {
      const s = await refreshStatus();
      if (!s || !s.has_drops) { el("chips").innerHTML = ""; el("out").innerHTML = noData(o.msg.noData()); return; }
      if (!el("chips").children.length || !key) await search(true);
    },
    reset() { key = null; data = null; el("chips").innerHTML = ""; },
    // 言語を切り替えたとき: 候補と結果を手元のデータで描き直す(取り直さない)
    relabel() { applyViewText(o.id); if (data) renderResult(); return el("chips").children.length ? loadChips() : null; },
  };
}

/* ---------- アイテムから探す ---------- */
/* 素材・パーツ/設計図・MOD・レリック・その他(AREA_KINDS)を種類のチェックで選んで探す。エリアから探すの逆向き。
   種類のチェックは localStorage(wf-item-kinds)に覚える。覚えていなければ ITEM_KIND_DEFAULT と同じ初期値。
   カテゴリー(マスター一覧と同じ分け方)と「Prime を除外する」はパーツだけに効く(パーツにチェックがあるときだけ出す) */
const ITEM_KIND_DEFAULT = ["resource", "part", "mod"];  // wfp/core/common.py の ITEM_KIND_DEFAULT と同じ(tests/test_parts.py が検査)
const itemKindBoxes = () => [...document.querySelectorAll("#item-kinds input[data-kind]")];
const itemKinds = () => itemKindBoxes().filter(x => x.checked).map(x => x.dataset.kind);
(() => {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("wf-item-kinds") || "null"); } catch (e) {}
  const on = Array.isArray(saved) ? saved : ITEM_KIND_DEFAULT;
  itemKindBoxes().forEach(x => { x.checked = on.includes(x.dataset.kind); });
})();
const itemHasPart = () => itemKinds().includes("part");
const showItemPartOpt = () => { $("#item-partopt").hidden = !itemHasPart(); };
showItemPartOpt();
// パーツのカテゴリーと「Prime を除外する」(以前のパーツ検索で覚えたものを引き継ぐ)
let itemCat = "";
try { itemCat = localStorage.getItem("wf-part-cat") || ""; } catch (e) {}
if (itemCat && !hasText("mastery.cat." + itemCat)) itemCat = "";  // 今は無いカテゴリーが残っていたら外す
try { $("#item-noprime").checked = localStorage.getItem("wf-part-noprime") === "1"; } catch (e) {}
const itemSearch = sourceSearch({
  id: "item",
  suggest: q => {
    const part = itemHasPart();
    return `/api/suggest/item?q=${encodeURIComponent(q)}&kinds=${itemKinds().join(",")}`
      + `&cat=${encodeURIComponent(part ? itemCat : "")}&noprime=${part && $("#item-noprime").checked ? 1 : 0}`;
  },
  list: res => res.items,
  tag: i => `<span class="tag-mini">${esc(t("area.kind." + i.kind))}</span>`,
  // 種類を1つも選んでいないときは候補を取らない(空の kinds はサーバーで「指定なし = 既定」になるため)
  blocked: () => (itemKinds().length ? "" : t("item.nokind")),
  onSuggest: res => {
    if (!res || !itemHasPart()) { $("#item-cats").innerHTML = ""; return; }
    const all = res.cats.reduce((n, c) => n + c.n, 0);
    // 選んでいるカテゴリーに名前の合う候補が無いときも、ボタンは 0 件で残す(押し直して外せるように)
    const cats = itemCat && !res.cats.some(c => c.key === itemCat) ? [...res.cats, { key: itemCat, n: 0 }] : res.cats;
    $("#item-cats").innerHTML = `<button class="chip" data-pcat="" aria-pressed="${!itemCat}">${esc(t("part.cat.all"))}<small>${all}</small></button>`
      + cats.map(c => `<button class="chip" data-pcat="${esc(c.key)}" aria-pressed="${itemCat === c.key}">${esc(tName("mastery.cat.", c.key))}<small>${c.n}</small></button>`).join("");
  },
  more: (res, items) => res.total > items.length ? `<span class="note">${esc(fmt("item.more", { n: res.total - items.length }))}</span>` : "",
  msg: {
    noMatch: () => t("item.nomatch"),
    pick: () => t("item.pick"),
    empty: () => t("item.empty"),
    noData: () => t("item.nodata"),
  },
});
$("#item-kinds").addEventListener("change", e => {  // 種類を変えたら覚えて、候補を取り直す
  if (!e.target.dataset.kind) return;
  try { localStorage.setItem("wf-item-kinds", JSON.stringify(itemKinds())); } catch (err) {}
  showItemPartOpt();
  itemSearch.search(false);
});
$("#item-cats").addEventListener("click", e => {
  const c = e.target.closest("[data-pcat]"); if (!c) return;
  itemCat = c.dataset.pcat;
  try { localStorage.setItem("wf-part-cat", itemCat); } catch (err) {}
  itemSearch.search(false);
});
$("#item-noprime").addEventListener("change", e => {  // 入手先がレリックのパーツ(Prime)を候補から外す。この PC に覚えさせる
  try { localStorage.setItem("wf-part-noprime", e.target.checked ? "1" : "0"); } catch (err) {}
  itemSearch.search(false);
});
loaders.item = () => { applyViewText("item"); return itemSearch.load(); };
relabel.item = itemSearch.relabel;

/* ---------- エリアから探す ---------- */
let areaSel = null, areaList = null, areaRes = null;  // 候補・結果は言語の切り替えで描き直すため手元に残す
const areaItem = i => (lang === "ja" ? i.ja : i.en);  // アイテム名(日本語の画面は日本語名、ほかは英名)
function renderAreaChips() {
  const list = areaList || [];
  $("#area-chips").innerHTML = list.length ? list.map(i =>
    `<button class="chip" data-type="${i.type}" data-key="${esc(i.key)}" aria-pressed="${areaSel && areaSel.key === i.key && areaSel.type === i.type}">${esc(renderTxt(i.name))}${i.sub ? `<small>${esc(renderTxt(i.sub))}</small>` : ""}</button>`).join("")
    : `<span class="note">${esc(t("area.nomatch"))}</span>`;
}
// 選んでいる種類(AREA_KINDS のキー)
const areaKinds = () => [...document.querySelectorAll("#area-kinds input[data-kind]")].filter(x => x.checked).map(x => x.dataset.kind);
async function loadAreaChips() {
  try {
    areaList = await api(`/api/suggest/area?q=${encodeURIComponent($("#area-q").value)}`);
    renderAreaChips();
    return areaList;
  } catch (e) { areaList = null; $("#area-out").innerHTML = noData(e.message); return []; }
}
function renderAreaResult() {
  const r = areaRes;
  if (!areaSel || !r) { if (!areaSel) $("#area-out").innerHTML = `<div class="empty">${esc(t("area.pick"))}</div>`; return; }
  const title = esc(renderTxt(r.title));
  if (!r.nodes.length) { $("#area-out").innerHTML = `<div class="result-head"><h3>${title}</h3></div>` + noData(t("area.none")); return; }
  const head = ["stage", "item", "chance", "rarity"].map(c => `<th>${esc(t("area.col." + c))}</th>`).join("");
  $("#area-out").innerHTML = `<div class="result-head"><h3>${title}</h3><span class="count">${esc(fmt("area.count", { n: r.nodes.length }))}</span></div>
    <div class="cards">${r.nodes.map(n => {
      const max = Math.max(1, ...n.stages.flatMap(s => s.items.map(i => i.chance)));
      const rows = n.stages.flatMap(s => s.items.map((i, k) => `<tr><td>${k === 0 ? esc(renderTxt(s.stage)) : ""}</td><td>${esc(areaItem(i))}<span class="tag-mini">${esc(t("area.kind." + i.kind))}</span></td>

/* ---------- ゲーム画面から MOD を読み取って所持チェック ---------- */
const AUTO_SCORE = 0.9;  // これ以上の一致度なら自動でチェック。未満は「要確認」
let scan = { on: false, stream: null, timer: null, busy: false, last: null, frames: 0, reads: 0, added: [], maybe: new Map(), seen: new Set() };
function scanRender(state) {
  $("#scan-panel").hidden = false;
  if (state !== undefined) $("#scan-state").textContent = state;
  $("#scan-stats").textContent = fmt("scan.stats", { reads: scan.reads, seen: scan.seen.size, added: scan.added.length });
  $("#scan-new").innerHTML = scan.added.length ? `<span class="mini">${esc(t("scan.added"))}</span><div class="chips">${scan.added.slice(-60).reverse()
    .map(en => `<button class="chip" data-undo="${esc(en)}">${esc(en)}<span class="x" aria-hidden="true">×</span></button>`).join("")}</div>` : "";
  const maybe = [...scan.maybe.values()];
  $("#scan-maybe").innerHTML = maybe.length ? `<span class="mini">${esc(t("scan.maybe"))}</span><div class="chips">${maybe
    .map(m => `<button class="chip" data-own="${esc(m.en)}" title="${esc(fmt("scan.read", { text: m.read }))}">${esc(m.en)}<small>${Math.round(m.score * 100)}%</small></button>`).join("")}</div>` : "";
}
async function markOwned(list, owned) {
  if (!list.length) return;
  await api("/api/mods/owned", { method: "POST", body: { en: list, owned } });
  if (mods) { const set = new Set(list.map(x => x.toLowerCase())); mods.forEach(m => { if (set.has(m.en.toLowerCase())) m.owned = owned; }); renderMods(); }
}
async function scanImage(blob) {
  const res = await fetch("/api/mods/scan", { method: "POST", headers: { "Content-Type": blob.type || "image/png" }, body: blob });
  const r = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(r.text ? renderTxt(r.text) : (r.error || fmt("err.http", { status: res.status })));
  scan.reads++;
  const confirm = $("#scan-confirm").checked, add = [];
  r.found.forEach(m => {
    scan.seen.add(m.en.toLowerCase());
    if (m.owned || scan.added.includes(m.en)) return;
    if (m.score >= AUTO_SCORE && !confirm) add.push(m.en);
    else scan.maybe.set(m.en.toLowerCase(), m);
  });
  if (add.length) { await markOwned(add, true); scan.added.push(...add); add.forEach(en => scan.maybe.delete(en.toLowerCase())); }
  return r.found.length;
}
/** 画面が前回の読み取りから変わったか(小さく縮めた白黒画像の差で判断) */
function frameChanged(video) {
  const c = document.createElement("canvas"); c.width = 64; c.height = 36;
  const g = c.getContext("2d", { willReadFrequently: true }); g.drawImage(video, 0, 0, 64, 36);
  const px = g.getImageData(0, 0, 64, 36).data, cur = new Uint8Array(64 * 36);
  for (let i = 0; i < cur.length; i++) cur[i] = (px[i * 4] + px[i * 4 + 1] + px[i * 4 + 2]) / 3;
  const prev = scan.last; scan.last = cur;
  if (!prev) return true;
  let d = 0; for (let i = 0; i < cur.length; i++) d += Math.abs(cur[i] - prev[i]);
  return d / cur.length > 1.5;
}
async function scanTick() {
  const v = $("#scan-video");
  if (!scan.on || scan.busy || !v.videoWidth) return;
  scan.frames++;
  if (!frameChanged(v)) { scanRender(t("scan.waiting")); return; }
  scan.busy = true;
  try {
    const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext("2d").drawImage(v, 0, 0);
    const blob = await new Promise(r => c.toBlob(r, "image/png"));
    scanRender(t("scan.reading"));
    const n = await scanImage(blob);
    scanRender(fmt("scan.found", { n }));
  } catch (e) { scanRender(fmt("scan.failed", { msg: e.message })); scan.last = null; }
  scan.busy = false;
}
async function scanStart() {
  const info = await loadOcrInfo();
  if (!info.available) { scanRender(fmt("scan.unavailable", { reason: ocrReason(info) })); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) { scanRender(t("scan.nobrowser")); return; }
  try {
    scan.stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 2 }, audio: false });
  } catch (e) { scanRender(t("scan.cancel")); return; }
  const v = $("#scan-video"); v.srcObject = scan.stream; await v.play().catch(() => {});
  scan.stream.getVideoTracks()[0].addEventListener("ended", scanStop);  // ブラウザ側で「共有を停止」したとき
  scan.on = true; scan.last = null;
  scanLabel();
  scanRender(t("scan.reading"));
  scan.timer = setInterval(scanTick, 2500); scanTick();
}
function scanStop() {
  scan.on = false; clearInterval(scan.timer); scan.timer = null;
  if (scan.stream) scan.stream.getTracks().forEach(tr => tr.stop());
  scan.stream = null; $("#scan-video").srcObject = null;
  scanLabel();
  if (!$("#scan-panel").hidden) scanRender(t("scan.stopped"));
}
/* 読み取りのボタンの文字(ON / OFF) */
function scanLabel() {
  $("#scan-toggle").setAttribute("aria-pressed", String(scan.on)); $("#scan-toggle").textContent = t(scan.on ? "scan.on" : "scan.off");
}
/* 文字認識が使えない理由(API のテキスト指定。無ければ「使えません」) */
const ocrReason = info => (info.reason ? renderTxt(info.reason) : t("err.ocr.none"));
$("#scan-toggle").addEventListener("click", () => scan.on ? scanStop() : scanStart());
$("#scan-file-btn").addEventListener("click", () => $("#scan-files").click());
$("#scan-files").addEventListener("change", async e => {
  const files = [...e.target.files]; e.target.value = "";
  const info = await loadOcrInfo();
  if (!info.available) { scanRender(fmt("scan.unavailable", { reason: ocrReason(info) })); return; }
  for (let i = 0; i < files.length; i++) {
    scanRender(fmt("scan.files", { i: i + 1, n: files.length }));
    try { await scanImage(files[i]); } catch (err) { scanRender(fmt("scan.file.failed", { file: files[i].name, msg: err.message })); return; }
  }
  scanRender(fmt("scan.files.done", { n: files.length }));
});
$("#scan-panel").addEventListener("click", async e => {
  const undo = e.target.closest("[data-undo]"), own = e.target.closest("[data-own]");
  try {
    if (undo) { const en = undo.dataset.undo; await markOwned([en], false); scan.added = scan.added.filter(x => x !== en); scanRender(); }
    if (own) { const en = own.dataset.own; await markOwned([en], true); scan.maybe.delete(en.toLowerCase()); scan.added.push(en); scanRender(); }
  } catch (err) { scanRender(err.message); }
});

/* ---------- Riven 相場 ---------- */
let rivens = null;
const rivSort = { key: "um", dir: "desc" };
const rivGetters = {
  w: r => r.veiled ? "" : rivWeapon(r).toLowerCase(), t: r => rivType(r.type),
  um: r => r.unrolled ? r.unrolled.median : null, ua: r => r.unrolled ? r.unrolled.avg : null, up: r => r.unrolled ? r.unrolled.pop : null,
  rm: r => r.rerolled ? r.rerolled.median : null, ra: r => r.rerolled ? r.rerolled.avg : null, rp: r => r.rerolled ? r.rerolled.pop : null,
};
const plat = v => Math.round(v).toLocaleString(locale());
/* 武器種(I18N の riven.type.<英語名>。表に無ければ " Riven Mod" を除いた英語名)・武器名(日本語の画面は日本語名) */
const rivType = k => (hasText("riven.type." + k) ? t("riven.type." + k) : k.replace(" Riven Mod", ""));
const rivWeapon = r => (r.veiled ? t("riv.veiled") : lang === "ja" ? r.weapon_ja : r.weapon_en);
function rivCells(st) {
  if (!st) return `<td class="num none">—</td><td class="num none">—</td><td class="num none">—</td><td class="num none">—</td>`;
  return `<td class="num med">${plat(st.median)}</td><td class="num">${plat(st.avg)}</td><td class="num mini">${esc(fmt("common.range", { a: plat(st.min), b: plat(st.max) }))}</td><td class="num">${Math.round(st.pop)}</td>`;
}
function renderRivens() {
  if (!rivens) return;
  const q = $("#riv-q").value.trim().toLowerCase(), ty = $("#riv-type").value, veiled = $("#riv-veiled").checked;
  const list = sortRows(rivens.rows.filter(r => (!ty || r.type === ty) && (veiled || !r.veiled) &&
    (!q || [r.weapon_ja, r.weapon_en, rivType(r.type)].some(x => (x || "").toLowerCase().includes(q)))), rivSort, rivGetters);
  $("#riv-summary").innerHTML = `<span>${fmt("riv.summary", { shown: `<b class="count">${list.length}</b>`, total: rivens.rows.length })}</span><span>${esc(fmt("riv.updated", { at: rivens.updated }))}</span>`;
  $("#riv-out").innerHTML = list.length ? `<div class="tablewrap tall"><table>
    <thead class="stack"><tr><th rowspan="2" class="sort" data-sort="w" aria-sort="${rivSort.key === "w" ? (rivSort.dir === "asc" ? "ascending" : "descending") : "none"}" tabindex="0">${esc(t("riv.col.weapon"))}</th>
      <th rowspan="2" class="sort" data-sort="t" aria-sort="${rivSort.key === "t" ? (rivSort.dir === "asc" ? "ascending" : "descending") : "none"}" tabindex="0">${esc(t("riv.col.type"))}</th>
      <th colspan="4" class="num">${esc(t("riv.unrolled"))}</th><th colspan="4" class="num">${esc(t("riv.rerolled"))}</th></tr>
      <tr>${["u", "r"].map(p => `${th(esc(t("riv.median")), p + "m", rivSort, "num")}${th(esc(t("riv.avg")), p + "a", rivSort, "num")}<th class="num">${esc(t("riv.range"))}</th>${th(esc(t("riv.pop")), p + "p", rivSort, "num")}`).join("")}</tr></thead>
    <tbody>${list.map(r => `<tr><td class="${r.veiled ? "veiled" : ""}">${esc(rivWeapon(r))}${!r.veiled && lang === "ja" && r.weapon_ja !== r.weapon_en ? `<span class="sub-en">${esc(r.weapon_en)}</span>` : ""}</td>
      <td>${esc(rivType(r.type))}</td>${rivCells(r.unrolled)}${rivCells(r.rerolled)}</tr>`).join("")}</tbody></table></div>`
    : noData(t("riv.none"));
}
onSortClick($("#riv-out"), rivSort, renderRivens, ["um", "ua", "up", "rm", "ra", "rp"]);
$("#riv-q").addEventListener("input", debounce(renderRivens, 150));
$("#riv-type").addEventListener("change", renderRivens);
$("#riv-veiled").addEventListener("change", renderRivens);
/* 武器種の選択肢(言語を切り替えたら作り直す。選んでいる値は残す) */
function renderRivenTypes() {
  const keep = $("#riv-type").value, types = [...new Set(rivens.rows.map(r => r.type))];
  $("#riv-type").innerHTML = `<option value="">${esc(t("riv.type.all"))}</option>` + types.map(k => `<option value="${esc(k)}">${esc(rivType(k))}</option>`).join("");

loaders.riven = async () => {

/* ---------- デュヴィリサーキット ---------- */
/* 今週の ID は API(Python)側で計算する。ここは表示・タブ・手動調整の送信だけ。文字はすべて I18N(t)から */
let duviri = null, dvMode = "normal";
const dvDate = iso => { const [, m, d] = iso.split("-"); return `${+m}/${+d}${t("duviri.weekday")}`; };
/* 報酬は英語名のまま表示する(Normal は Warframe、Steel Path は武器。JSON の綴りがそのまま出る) */
const dvItem = it => it ? esc(it) : "";
function dvTable(rows, cols, withDate) {
  const n = Array.from({ length: cols }, (_, i) => i);
  return `<div class="tablewrap"><table><thead><tr>${withDate ? `<th>${esc(t("duviri.date"))}</th>` : ""}${
    n.map(i => `<th>${esc(t("duviri.col").replace("{n}", i + 1))}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${withDate ? `<td>${esc(dvDate(r.date))}</td>` : ""}${
      n.map(i => `<td>${dvItem(r.items[i])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function renderDuviri() {
  applyViewText("duviri");
  if (!duviri) return;
  const keys = duviri.modes.map(m => m.key);
  if (!keys.includes(dvMode)) dvMode = keys[0];
  $("#dv-modes").innerHTML = duviri.modes.map(m =>
    `<button type="button" class="chip" data-dvmode="${esc(m.key)}" aria-pressed="${m.key === dvMode}">${esc(t("duviri." + m.key))}</button>`).join("");
  const m = duviri.modes.find(x => x.key === dvMode);
  $("#dv-adjust").hidden = !m || !m.ok;
  if (!m || !m.ok) { $("#dv-out").innerHTML = noData(t("duviri.broken")); return; }
  $("#dv-out").innerHTML = `<h3 class="dv-h">${esc(t("duviri.current"))}<span class="note">${esc(fmt("duviri.from", { date: dvDate(m.current.date) }))}</span>${
      m.manual ? `<span class="tag-event">${esc(t("duviri.manual"))}</span>` : ""}</h3>
    ${dvTable([m.current], m.columns, false)}
    <h3 class="dv-h">${esc(t("duviri.upcoming"))}</h3>
    ${m.upcoming.length ? dvTable(m.upcoming, m.columns, true) : noData(t("duviri.none"))}`;
  $("#dv-id").innerHTML = m.rotation.map(r =>

/* 選択中のタブを押しても何もしない(AC-1 / AC-3) */
$("#dv-modes").addEventListener("click", e => {
  const b = e.target.closest("[data-dvmode]");

async function dvPost(path, body) {

  catch (e) { $("#dv-err").textContent = e.message; }

$("#dv-form").addEventListener("submit", e => { e.preventDefault(); dvPost("/api/duviri/adjust", { mode: dvMode, id: +$("#dv-id").value }); });
$("#dv-reset").addEventListener("click", () => dvPost("/api/duviri/reset", { mode: dvMode }));
/* 開くたびに取り直す(週を跨いでも開き直せば新しくなる) */

/* ---------- MOD 効果検索 ---------- */
/* 入力に部分一致する影響先(data/mod_stats/targets.json の表示名)を候補に出し、選んだ影響先の MOD を /api/modstats で一覧にする。
   1つに決まれば(完全一致・候補が1件)すぐ探し、候補が無ければ効果テキストの全文検索。Enter か「全文で探す」でも全文検索。
   区分のチェックは localStorage(wf-modstats-groups)に覚える(覚えていなければ全部)。効果テキストは画面の言語(ja が無ければ en) */
let mfxCands = [], mfxPick = null, mfxRes = null, mfxMsg = "modstats.empty";  // 候補・選んだもの({target} か {text})・結果・結果が無いときの案内
const mfxBoxes = () => [...document.querySelectorAll("#mfx-groups input[data-group]")];
const mfxGroups = () => mfxBoxes().filter(x => x.checked).map(x => x.dataset.group);
(() => {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("wf-modstats-groups") || "null"); } catch (e) {}
  if (Array.isArray(saved)) mfxBoxes().forEach(x => { x.checked = saved.includes(x.dataset.group); });
})();
const mfxName = o => (lang === "ja" ? o.ja : o.en);
const mfxNote = key => { mfxRes = null; mfxMsg = key; $("#mfx-out").innerHTML = `<div class="empty">${esc(t(key))}</div>`; };
function renderMfxChips() {
  const q = $("#mfx-q").value.trim();
  $("#mfx-chips").innerHTML = mfxCands.map(c =>
    `<button class="chip" data-mfxtarget="${esc(c.key)}" aria-pressed="${!!mfxPick && mfxPick.target === c.key}">${esc(mfxName(c))}</button>`).join("")
    + (q ? `<button class="chip" data-mfxtext="1" aria-pressed="${!!mfxPick && "text" in mfxPick}">${esc(fmt("modstats.fulltext", { q }))}</button>` : "");
}
function mfxCard(row, target, names) {
  const sub = lang === "ja" && row.ja !== row.en ? row.en : "";
  const compat = row.compat && row.compat !== row.compat.toUpperCase()
    ? `<span class="tag-mini">${esc(fmt("modstats.compat", { name: hasText("mod.compat." + row.compat) ? t("mod.compat." + row.compat) : row.compat }))}</span>` : "";
  const head = `<div class="mfx-head"><b>${esc(mfxName(row))}</b>${sub ? `<span class="en">${esc(sub)}</span>` : ""}${
    row.groups.map(g => `<span class="tag-mini">${esc(t("mod.group." + g))}</span>`).join("")}${compat}</div>`;
  const ranks = lang === "ja" && row.stats_ja.length ? row.stats_ja : row.stats_en;
  if (!ranks.length) return `<div class="mfx-card">${head}<p class="mfx-desc">${esc(lang === "ja" && row.desc_ja ? row.desc_ja : row.desc_en)}</p></div>`;
  // 列の見出し = その行の影響先(最大ランクの en で判定)。選んだ影響先の列は強調、条件付きは印を付ける
  const cols = row.lines.map(ln => ({
    hit: !!target && ln.targets.includes(target), cond: ln.cond,
    label: ln.targets.map(k => (names[k] ? mfxName(names[k]) : k)).join(" / ") || "-" }));
  const cls = j => (cols[j] && cols[j].hit ? ` class="hit"` : "");
  return `<div class="mfx-card">${head}<div class="tablewrap"><table>
    <thead><tr><th class="rk">${esc(t("modstats.rank"))}</th>${cols.map((c, j) =>
      `<th${cls(j)}>${esc(c.label)}${c.cond ? `<span class="tag-cond">${esc(t("modstats.cond"))}</span>` : ""}</th>`).join("")}</tr></thead>
    <tbody>${ranks.map((lns, i) => `<tr><td class="rk">${i}</td>${lns.map((s, j) => `<td${cls(j)}>${esc(s)}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div></div>`;
}
function renderMfxResult() {
  const r = mfxRes; if (!r) return;
  const title = r.target ? fmt("modstats.target", { name: mfxName(r.target) }) : fmt("modstats.text", { q: r.query });
  const key = r.target && r.target.key;
  $("#mfx-out").innerHTML = `<div class="result-head"><h3>${esc(title)}</h3><span class="count">${esc(fmt("modstats.count", { n: r.total }))}</span>${
      r.updated ? `<span class="note">${esc(fmt("modstats.updated", { at: r.updated }))}</span>` : ""}</div>
    ${r.total > r.rows.length ? `<p class="note">${esc(fmt("modstats.more", { n: r.rows.length }))}</p>` : ""}
    ${r.rows.length ? r.rows.map(row => mfxCard(row, key, r.names)).join("") : `<div class="empty">${esc(t("modstats.nomatch"))}</div>`}`;
}
async function mfxFetch() {
  if (!mfxPick) return;
  const groups = mfxGroups();
  if (!groups.length) { mfxNote("modstats.nogroup"); return; }
  const pick = mfxPick, qs = pick.target ? `target=${encodeURIComponent(pick.target)}` : `q=${encodeURIComponent(pick.text)}`;
  try {
    const res = await api(`/api/modstats?${qs}&groups=${groups.join(",")}`);
    if (pick !== mfxPick) return;  // 待っている間に選び直していたら捨てる
    mfxRes = { ...res, query: pick.text || "" };
    renderMfxResult();
  } catch (e) { mfxRes = null; $("#mfx-out").innerHTML = noData(e.message); }
}
async function mfxSearch() {
  const q = $("#mfx-q").value.trim();
  mfxPick = null;
  if (!q) { mfxCands = []; renderMfxChips(); mfxNote("modstats.empty"); return; }
  let cands = [];
  try { cands = (await api(`/api/modstats/suggest?q=${encodeURIComponent(q)}`)).items; } catch (e) {}
  if ($("#mfx-q").value.trim() !== q) return;  // 入力が変わっていたら捨てる
  mfxCands = cands;
  const exact = cands.find(c => [c.ja, c.en].some(n => n.toLowerCase() === q.toLowerCase()));
  if (exact || cands.length === 1) mfxPick = { target: (exact || cands[0]).key };
  else if (!cands.length) mfxPick = { text: q };
  renderMfxChips();
  if (mfxPick) await mfxFetch(); else mfxNote("modstats.pick");
}
function mfxPickText() {
  const q = $("#mfx-q").value.trim(); if (!q) return;
  mfxPick = { text: q }; renderMfxChips(); mfxFetch();
}
$("#mfx-q").addEventListener("input", debounce(mfxSearch, 250));
$("#mfx-q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); mfxPickText(); } });
$("#mfx-chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  if (c.dataset.mfxtext) { mfxPickText(); return; }
  mfxPick = { target: c.dataset.mfxtarget }; renderMfxChips(); mfxFetch();
});
const mfxGroupsChanged = () => {
  try { localStorage.setItem("wf-modstats-groups", JSON.stringify(mfxGroups())); } catch (err) {}
  if (mfxPick) mfxFetch();
};
$("#mfx-groups").addEventListener("change", e => { if (e.target.dataset.group) mfxGroupsChanged(); });
$("#mfx-all").addEventListener("click", () => { mfxBoxes().forEach(x => { x.checked = true; }); mfxGroupsChanged(); });
$("#mfx-none").addEventListener("click", () => { mfxBoxes().forEach(x => { x.checked = false; }); mfxGroupsChanged(); });
/* 開いたとき: データの有無だけ確かめる(結果と入力は残す。データ更新の後に開き直せば読み直す) */
loaders.modstats = async () => {
  applyViewText("modstats");
  try {
    const res = await api("/api/modstats/suggest?q=");
    if (!res.has_data) { mfxCands = []; renderMfxChips(); mfxNote("modstats.nodata"); return; }
  } catch (e) { $("#mfx-out").innerHTML = noData(e.message); return; }
  if (mfxPick) await mfxFetch(); else mfxNote(mfxMsg === "modstats.nodata" ? "modstats.empty" : mfxMsg);
};
relabel.modstats = () => { applyViewText("modstats"); renderMfxChips(); if (mfxRes) renderMfxResult(); else mfxNote(mfxMsg); };

/* ---------- Q&A ---------- */
/* 答えの文は API(Python)が日本語で作る(Q&A は日本語のみ)。ここは表示とボタンだけ。枠の文字(ボタン・見出し)は I18N(t)から。
   履歴は新しいものを上に QA_LOG_MAX 件まで(ページを離れても残す。データは取り直さない) */
const QA_LOG_MAX = 20;
let qaLog = [];  // [{res, done}] done = ビルド管理に追加した名前 {ビルド名: 保存した名前}
async function qaAsk(params) {
  const qs = new URLSearchParams(params).toString();
  try {
    const res = await api(`/api/qa?${qs}`);
    qaLog.unshift({ res, done: {} }); qaLog = qaLog.slice(0, QA_LOG_MAX);
  } catch (e) { qaLog.unshift({ err: e.message, q: params.q || "" }); }
  renderQa();
}
const qaChip = (label, name, intent) =>
  `<button type="button" class="chip" data-qaname="${esc(name)}"${intent ? ` data-qaintent="${esc(intent)}"` : ""}>${esc(label)}</button>`;
function qaBuildCard(b, done) {
  const row = (key, val) => val ? `<dt>${esc(t(key))}</dt><dd>${esc(val)}</dd>` : "";
  return `<div class="qa-build"><header><b>${esc(b.name)}</b><span>${esc(b.type_ja)} / ${esc(b.target_ja)} / ${esc(fmt("qa.b.forma", { n: b.forma }))}</span></header>
    <dl>${b.mods.length ? `<dt>${esc(t("qa.b.mods"))}</dt><dd><ol class="mods">${b.mods.map(m =>
      `<li>${esc(m.name)}${m.effect ? `<span class="mod-eff">${esc(m.effect)}</span>` : ""}</li>`).join("")}</ol></dd>` : ""}${row("qa.b.arcanes", b.arcanes.join("、"))}${row("qa.b.helminth", b.helminth)}${
      row("qa.b.shards", b.shards.join("\n"))}${row("qa.b.note", b.note)}</dl>
    <div class="row">${done
      ? `<span class="mini">${esc(fmt("qa.adopt.done", { name: done }))}</span> <button type="button" class="btn ghost" data-qaopen="${esc(done)}">${esc(t("qa.adopt.open"))}</button>`
      : `<button type="button" class="btn ghost" data-qaadopt="${esc(b.name)}" data-qaadoptname="${esc(b.adopt_name)}">${esc(t("qa.adopt"))}</button>`}</div></div>`;
}
function qaItem(entry, idx) {
  if (entry.err) return `<div class="qa-item"><div class="qa-q">${esc(entry.q)}</div><div class="err">${esc(entry.err)}</div></div>`;
  const r = entry.res;
  const q = r.q || (r.name ? r.name.ja : "");
  let h = `<div class="qa-item" data-qaidx="${idx}"><div class="qa-q">${esc(t("qa.you"))} ${esc(q)}</div>`;
  if (r.miss && r.miss.text) h += `<p class="qa-a qa-miss">${esc(r.miss.text)}</p>`;
  if (r.text) h += `<p class="qa-a"><b>${esc(r.text)}</b></p>`;
  if (r.facts.length) h += `<div class="tablewrap"><table class="qa-facts"><tbody>${r.facts.map(f =>
    `<tr><td>${esc(f.label)}</td><td>${esc(f.value)}</td></tr>`).join("")}</tbody></table></div>`;
  for (const g of r.sources) {
    if (g.title) h += `<div class="qa-group">${esc(g.title)}</div>`;
    h += `<div class="tablewrap"><table><thead><tr><th>${esc(t("qa.col.chance"))}</th><th>${esc(t("qa.col.where"))}</th></tr></thead><tbody>${

let inv = null;

/* ---------- Tips ---------- */
/* tips フォルダのメモ(.md / .txt / .csv)を表示する。.md は簡単な書き方(見出し・表・箇条書きなど)に対応 */
let tipsList = null, tipCur = null, tipSeq = 0, tipFile = null, tipHeads = "", tipTrashOpen = false;
try { tipCur = localStorage.getItem("wf-tip"); } catch (e) {}
const TIP_KINDS = /\.(md|markdown|txt|csv)$/i, TIP_IMAGES = /\.(png|jpe?g|gif|webp)$/i;
function tipResolve(base, src) {  // メモのファイルから見た相対パス -> tips フォルダの中のパス
  let s = src; try { s = decodeURIComponent(src); } catch (e) {}
  const parts = base ? base.split("/") : [];
  for (const seg of s.replace(/\\/g, "/").split("/")) {
    if (seg === "..") parts.pop(); else if (seg && seg !== ".") parts.push(seg);
  }
  return parts.join("/");
}
const tipUrl = path => "/tips/" + path.split("/").map(encodeURIComponent).join("/");
function mdInline(s, base) {
  const keep = [], put = html => `\u0000${keep.push(html) - 1}\u0000`;
  s = s.replace(/\u0000/g, "");
  s = s.replace(/`([^`]+)`/g, (_, c) => put(`<code>${esc(c)}</code>`));
  s = s.replace(/!\[([^\]]*)\]\(\s*<?([^)\s>]+)>?(?:\s+"[^"]*")?\s*\)/g, (_, alt, src) => {
    if (/^https?:\/\//i.test(src)) return put(`<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy">`);
    if (/^[a-z][a-z0-9+.-]*:/i.test(src) || !TIP_IMAGES.test(src)) return put(esc(alt));
    return put(`<img src="${esc(tipUrl(tipResolve(base, src)))}" alt="${esc(alt)}" loading="lazy">`);
  });
  s = s.replace(/\[([^\]]+)\]\(\s*<?([^)\s>]+)>?(?:\s+"[^"]*")?\s*\)/g, (_, text, href) => {
    if (/^https?:\/\//i.test(href)) return put(`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(text)}</a>`);
    if (/^[a-z][a-z0-9+.-]*:/i.test(href)) return put(esc(text));
    const path = tipResolve(base, href.split("#")[0]);
    if (TIP_KINDS.test(path)) return put(`<a href="#" data-tip="${esc(path)}">${esc(text)}</a>`);
    if (TIP_IMAGES.test(path)) return put(`<a href="${esc(tipUrl(path))}" target="_blank" rel="noopener">${esc(text)}</a>`);
    return put(esc(text));
  });
  s = s.replace(/https?:\/\/[^\s<>"'　-ヿ＀-￯]+[^\s<>"'.,;:!?)\]　-ヿ＀-￯]/g,
    url => put(`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>`));
  s = esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*(?!\s)([^*]*[^*\s])\*(?!\*)/g, "$1<em>$2</em>")
    .replace(/~~(.+?)~~/g, "<del>$1</del>")
    .replace(/==(.+?)==/g, "<mark>$1</mark>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => keep[+i]);
}
function mdToHtml(text, base, ctx = { h: 0 }) {
  const lines = text.replace(/\r\n?/g, "\n").replace(/\t/g, "    ").split("\n");
  const out = []; let para = [], i = 0;
  const flush = () => { if (para.length) { out.push(`<p>${para.map(l => mdInline(l, base)).join("<br>")}</p>`); para = []; } };
  const LIST = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/;
  const isSep = l => /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(l);
  const cells = l => {
    let s = l.trim(); if (s.startsWith("|")) s = s.slice(1); if (s.endsWith("|") && !s.endsWith("\\|")) s = s.slice(0, -1);
    return s.split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, "|"));
  };
  while (i < lines.length) {
    const l = lines[i];
    let m;
    if ((m = l.match(/^\s*(`{3,}|~{3,})/))) {             // コード
      flush(); const fence = m[1], code = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith(fence)) code.push(lines[i++]);
      i++; out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`); continue;
    }
    if (!l.trim()) { flush(); i++; continue; }
    if ((m = l.match(/^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/))) { // 見出し
      flush(); const n = m[1].length; out.push(`<h${n} id="tip-h-${ctx.h++}">${mdInline(m[2], base)}</h${n}>`); i++; continue;
    }
    if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(l)) { flush(); out.push("<hr>"); i++; continue; }
    if (l.includes("|") && i + 1 < lines.length && lines[i + 1].includes("-") && isSep(lines[i + 1])) { // 表
      flush();
      const head = cells(l), align = cells(lines[i + 1]).map(c => c.endsWith(":") ? (c.startsWith(":") ? "center" : "right") : "");
      const rows = []; i += 2;
      while (i < lines.length && lines[i].trim() && lines[i].includes("|")) rows.push(cells(lines[i++]));
      const td = (tag, c, k) => `<${tag}${align[k] ? ` style="text-align:${align[k]}"` : ""}>${mdInline(c, base).replace(/&lt;br\s*\/?&gt;/gi, "<br>")}</${tag}>`;
      out.push(`<div class="tablewrap"><table><thead><tr>${head.map((c, k) => td("th", c, k)).join("")}</tr></thead>
        <tbody>${rows.map(r => `<tr>${head.map((_, k) => td("td", r[k] || "", k)).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if (/^\s{0,3}>/.test(l)) {                               // 引用
      flush(); const q = [];
      while (i < lines.length && /^\s{0,3}>/.test(lines[i])) q.push(lines[i++].replace(/^\s{0,3}>\s?/, ""));
      out.push(`<blockquote>${mdToHtml(q.join("\n"), base, ctx)}</blockquote>`); continue;
    }
    if (LIST.test(l)) {                                      // 箇条書き(字下げで入れ子)
      flush(); const items = [];
      while (i < lines.length) {
        const x = lines[i], lm = x.match(LIST);
        if (lm) { items.push({ indent: lm[1].length, ordered: /\d/.test(lm[2]), start: parseInt(lm[2], 10) || 1, lines: [lm[3]] }); i++; continue; }
        if (x.trim() && /^\s{2,}/.test(x) && items.length) { items[items.length - 1].lines.push(x.trim()); i++; continue; }
        if (!x.trim() && i + 1 < lines.length && LIST.test(lines[i + 1])) { i++; continue; }
        break;
      }
      let html = ""; const stack = [];
      for (const it of items) {
        const tag = it.ordered ? "ol" : "ul";
        while (stack.length && it.indent < stack[stack.length - 1].indent) html += `</li></${stack.pop().tag}>`;
        const top = stack[stack.length - 1];
        if (!top || it.indent > top.indent) {
          html += `<${tag}${it.ordered && it.start !== 1 ? ` start="${it.start}"` : ""}>`; stack.push({ indent: it.indent, tag });
        } else {
          html += "</li>";
          if (top.tag !== tag) { html += `</${top.tag}><${tag}>`; top.tag = tag; }
        }
        let first = it.lines[0], cls = "";
        const task = first.match(/^\[([ xX])\]\s+(.*)$/);
        if (task) { cls = ' class="task"'; first = task[2]; }
        const body = [first, ...it.lines.slice(1)].map(x => mdInline(x, base)).join("<br>");
        html += `<li${cls}>${task ? `<input type="checkbox" disabled${task[1] !== " " ? " checked" : ""}>` : ""}${body}`;
      }
      while (stack.length) html += `</li></${stack.pop().tag}>`;
      out.push(html); continue;
    }
    para.push(l.trim()); i++;
  }
  flush();
  return out.join("\n");
}
/* 目次: API の toc(直下のメモとグループの並び)から描く。▲▼ で並べ替え(_order.json に保存) */
const tipMv = (list, i, n) => `<button type="button" class="mv" data-list="${esc(list)}" data-i="${i}" data-d="-1" aria-label="上へ" title="上へ"${i ? "" : " disabled"}>▲</button>`
  + `<button type="button" class="mv" data-list="${esc(list)}" data-i="${i}" data-d="1" aria-label="下へ" title="下へ"${i < n - 1 ? "" : " disabled"}>▼</button>`;
function renderTipsToc(heads = tipHeads) {
  if (!tipsList) return;
  tipHeads = heads;
  const toc = tipsList.toc || [];
  const link = (t, inGrp, list, i, n) => {
    const cur = t.path === tipCur;
    return `<div class="ti"><a href="#" data-tip="${esc(t.path)}" class="${inGrp ? "in-grp" : ""}" aria-current="${cur}">${esc(t.title)}</a>${tipMv(list, i, n)}</div>`
      + (cur && heads ? `<div class="heads${inGrp ? " in-grp" : ""}">${heads}</div>` : "");
  };
  const html = toc.map((e, i) => e.type === "group"
    ? `<div class="grp"><span>${esc(e.label)}${e.items.length ? "" : `<span class="empty-grp">(空)</span>`}</span>${tipMv("top", i, toc.length)}</div>`
      + e.items.map((t, j) => link(t, true, "g:" + e.name, j, e.items.length)).join("")
    : link(e, false, "top", i, toc.length)).join("");
  $("#tips-toc").innerHTML = html || `<div class="empty">メモがありません</div>`;
}
async function moveTip(list, i, d) {
  const toc = tipsList.toc, order = { top: [...tipsList.order.top], groups: { ...tipsList.order.groups } };
  const key = e => e.type === "group" ? e.name + "/" : e.path;
  const swap = arr => { const a = [...arr]; [a[i], a[i + d]] = [a[i + d], a[i]]; return a; };
  if (list === "top") order.top = swap(toc.map(key));  // 動かした一覧だけを差し替える(ほかは保存済みの並びのまま)
  else {
    const g = toc.find(e => e.type === "group" && "g:" + e.name === list); if (!g) return;
    order.groups[g.name] = swap(g.items.map(it => it.path.slice(g.name.length + 1)));
  }
  try { tipsList = await api("/api/tips/order", { method: "POST", body: order }); $("#tips-err").textContent = ""; }
  catch (e) { $("#tips-err").textContent = e.message; return; }
  renderTipsToc();
  $(`#tips-toc .mv[data-list="${CSS.escape(list)}"][data-i="${i + d}"][data-d="${d}"]`)?.focus();  // 続けて押せるように
}
function tipsButtons() {
  const editing = !!tipEdit;
  ["#tips-new", "#tips-group", "#tips-trash-btn"].forEach(s => { $(s).disabled = editing; });  // 再読み込みは押せる(確認してから読み直す)
  $("#tips-edit-btn").disabled = editing || !(tipFile && tipFile.path === tipCur && tipFile.editable);
  $("#tips-del").disabled = editing || !(tipFile && tipFile.path === tipCur);
  $("#tips-trash-btn").setAttribute("aria-pressed", String(tipTrashOpen));
  $("#tips-body").hidden = editing || tipTrashOpen;
  $("#tips-edit").hidden = !editing;
  $("#tips-trash").hidden = editing || !tipTrashOpen;
}
async function openTip(path) {
  if (!tipLeaveEdit()) return;
  const seq = ++tipSeq; tipCur = path; tipFile = null; tipTrashOpen = false; $("#tips-err").textContent = "";
  try { localStorage.setItem("wf-tip", path); } catch (e) {}
  renderTipsToc(""); tipsButtons();
  let f;
  try { f = await api(`/api/tips/file?path=${encodeURIComponent(path)}`); }
  catch (e) { if (seq === tipSeq) $("#tips-body").innerHTML = noData(e.message); return; }
  if (seq !== tipSeq) return;
  tipFile = f;
  const base = path.includes("/") ? path.slice(0, path.lastIndexOf("/")) : "";
  let body;
  if (f.kind === "csv") {

    const cell = (tag, c) => `<${tag}>${mdInline(c || "", base).replace(/\n/g, "<br>")}</${tag}>`;
    body = `<h1>${esc(f.title)}</h1>` + (head.length ? `<div class="tablewrap"><table><thead><tr>${Array.from({ length: n }, (_, k) => cell("th", head[k])).join("")}</tr></thead>
      <tbody>${rows.map(r => `<tr>${Array.from({ length: n }, (_, k) => cell("td", r[k])).join("")}</tr>`).join("")}</tbody></table></div>` : noData("中身が空です。"));
  } else if (f.kind === "txt") {
    body = `<h1>${esc(f.title)}</h1><pre>${esc(f.text)}</pre>`;
  } else {
    body = mdToHtml(f.text, base);
    if (!/^<h1[ >]/.test(body)) body = `<h1>${esc(f.title)}</h1>` + body;
  }
  $("#tips-body").innerHTML = `<p class="tip-meta">${esc(f.path)}${f.updated ? ` ・ ${esc(f.updated)} 更新` : ""}</p>` + body;
  const heads = [...$("#tips-body").querySelectorAll("h2[id], h3[id]")]
    .map(h => `<a href="#" data-h="${h.id}" class="${h.tagName.toLowerCase()}">${esc(h.textContent)}</a>`).join("");

async function loadTips() {

/* 確認の小窓: buttons = [{label, value, cls}]。押したボタンの value(Esc・キャンセルは "")を返す */

/* 編集: 新規(タイトル + 保存先)と既存の .md の書き換え。保存しないで離れるときは確認する */

async function saveTipEdit() {

/* 書き方の挿入。execCommand("insertText") を優先して Ctrl+Z で戻せるようにする */
function teReplace(ta, start, end, text, selStart = start + text.length, selEnd = selStart) {
  ta.focus(); ta.setSelectionRange(start, end);
  if (!document.execCommand("insertText", false, text)) ta.setRangeText(text, start, end, "end");
  ta.setSelectionRange(selStart, selEnd);
}
const tipTable = () => t("te.table");  // 表の雛形(見出しは表示中の言語)
$("#tips-edit").querySelector(".te-tools").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const ta = $("#te-text"), v = ta.value, s = ta.selectionStart, en = ta.selectionEnd;
  if (b.dataset.line) {  // 選んだ行すべての行頭に入れる
    const ls = v.lastIndexOf("\n", s - 1) + 1, le = v.indexOf("\n", Math.max(en - (en > s && v[en - 1] === "\n" ? 1 : 0), s));
    const end = le < 0 ? v.length : le, block = v.slice(ls, end).split("\n").map(l => b.dataset.line + l).join("\n");
    teReplace(ta, ls, end, block, ls + block.length);
  } else if (b.dataset.block === "table") {  // カーソルの行が空ならそこへ、そうでなければ次の行へ
    const ls = v.lastIndexOf("\n", s - 1) + 1, le = v.indexOf("\n", s), end = le < 0 ? v.length : le;
    const tb = tipTable(), w = tb.indexOf(" |", 2) - 2;  // 最初の見出しの長さ(挿入後にそこを選ぶ)
    if (v.slice(ls, end).trim() === "") teReplace(ta, ls, end, tb.slice(0, -1), ls + 2, ls + 2 + w);
    else teReplace(ta, end, end, "\n" + tb.slice(0, -1), end + 3, end + 3 + w);
  } else if (b.dataset.wrap) {
    const w = b.dataset.wrap, sel = v.slice(s, en);
    teReplace(ta, s, en, w + sel + w, s + w.length, s + w.length + sel.length);
  } else if (b.dataset.ins) teReplace(ta, s, en, b.dataset.ins);
});

/* 計算画面は web/wfportal_builder.html (/builder)。初めて開いたときに読み込み、配色と高さをポータルに合わせる */
const SIM_VARS = ["--bg", "--panel", "--panel-2", "--line", "--ink", "--mute", "--primary", "--primary-bg", "--on-primary",
  "--secondary", "--on-secondary", "--accent", "--accent-bg", "--danger", "--font", "--mono"];
let simObserver = null;
function simDoc() { try { return $("#sim-frame").contentDocument; } catch (e) { return null; } }
function simTheme() {
  const doc = simDoc(); if (!doc || !doc.documentElement) return;
  const cs = getComputedStyle(document.documentElement);
  SIM_VARS.forEach(v => { const x = cs.getPropertyValue(v).trim(); if (x) doc.documentElement.style.setProperty(v, x); });
  const scheme = cs.getPropertyValue("color-scheme").trim();
  if (scheme) doc.documentElement.style.colorScheme = scheme;
}
function simFit() {
  // 中身(.wrap)の高さに合わせる。文書全体の高さは iframe の高さ以下にならないので、縮むときのために中身で測る
  const doc = simDoc(), wrap = doc && doc.querySelector(".wrap"); if (!wrap) return;
  $("#sim-frame").style.height = Math.max(420, Math.ceil(wrap.getBoundingClientRect().height) + 8) + "px";
}
$("#sim-frame").addEventListener("load", () => {

  if (doc && window.ResizeObserver) { simObserver?.disconnect(); simObserver = new ResizeObserver(simFit); simObserver.observe(doc.querySelector(".wrap") || doc.body); }
});

/* ---------- マスター一覧 ---------- */
let mastery = null, msCat = "", msArmed = null;
// ファウンダー限定品(カテゴリー founder)は、チェック ON のときだけ一覧・件数・経験値の合計に入れる
let msFounder = false;
try { msFounder = localStorage.getItem("wf-mastery-founder") === "1"; } catch (e) {}
$("#ms-founder").checked = msFounder;

/* 名前: 日本語の画面は日本語名、ほかは英名。Kitgun はプライマリ版・セカンダリ版を区別する(I18N の mastery.variant) */
const msLabel = r => { const n = lang === "ja" ? r.ja : r.en; return r.variant ? fmt("mastery.variant", { name: n, variant: t("mastery.variant." + r.variant) }) : n; };
const msSort = { key: "cat", dir: "asc" };
const msGetters = {
  done: r => (r.done ? 1 : 0), name: r => msLabel(r).toLowerCase(), rank: r => r.rank, xp: r => r.xp,
  cat: r => mastery.cats.indexOf(r.cat) * 10000 + 0, // 並べ替えの基準: カテゴリー順 -> 名前
};
function msFilter() {
  const q = $("#ms-q").value.trim().toLowerCase(), st = $("#ms-state").value;
  return msRows().filter(r => (!msCat || r.cat === msCat) && (!st || (st === "done") === r.done) &&
    (!q || [r.en, r.ja, msLabel(r)].some(x => (x || "").toLowerCase().includes(q))));
}
function msSummary() {
  const sm = { all: { total: 0, done: 0, xp: 0, xp_done: 0 } };
  mastery.cats.forEach(c => sm[c] = { total: 0, done: 0, xp: 0, xp_done: 0 });
  msRows().forEach(r => [sm[r.cat], sm.all].forEach(o => { o.total++; o.xp += r.xp; if (r.done) { o.done++; o.xp_done += r.xp; } }));
  return sm;
}
function renderMastery() {
  if (!mastery) return;

  $("#ms-cats").innerHTML = [["", t("src.all"), sm.all], ...msCats().map(k => [k, tName("mastery.cat.", k), sm[k]])]

  let list = msFilter();
  list = sortRows(list, msSort, msGetters);
  if (msSort.key === "cat") list.sort((a, b) => (msGetters.cat(a) - msGetters.cat(b)) * (msSort.dir === "asc" ? 1 : -1) || msLabel(a).localeCompare(msLabel(b), locale()));

  $("#ms-summary").innerHTML = `<span><b class="count">${esc(msCat ? tName("mastery.cat.", msCat) : t("ms.all"))}</b> ${esc(fmt("ms.summary", { done: cur.done, total: cur.total, pct: pctDone.toFixed(1) }))}</span>
    <span class="progress" aria-hidden="true"><i style="--w:${pctDone.toFixed(1)}%"></i></span>
    <span>${esc(fmt("ms.xp", { done: cur.xp_done.toLocaleString(locale()), total: cur.xp.toLocaleString(locale()) }))}</span><span>${esc(fmt("common.shown", { n: list.length }))}</span>`;
  ["on", "off"].forEach(k => {

    <tbody>${list.map(r => `<tr class="${r.done ? "owned" : ""}" data-id="${esc(r.id)}">
      <td class="chk"><input type="checkbox" class="own" ${r.done ? "checked" : ""} aria-label="${esc(fmt("ms.done.aria", { name: msLabel(r) }))}"></td>
      <td>${esc(msLabel(r))}${lang === "ja" && r.ja !== r.en ? `<span class="sub-en">${esc(r.en)}</span>` : ""}</td><td>${esc(tName("mastery.cat.", r.cat))}</td>
      <td class="num">${r.rank}</td><td class="num">${r.xp.toLocaleString(locale())}</td></tr>`).join("")}</tbody></table></div>`
    : noData(t("common.none"));
}

/* ---------- マスター一覧: ゲーム画面からの読み取り(MOD 側の scan* とは別に持つ) ----------
   API(POST /api/mastery/scan)は読み取って判定するだけ。印は POST /api/mastery で付ける。自動では外さない */
const msScan = { on: false, stream: null, timer: null, busy: false, last: null, reads: 0, tab: null, english: true,
                 added: [], maybe: new Map(), seen: new Set(), unknown: new Set() };
/* 要確認の理由とランクの読み取りを1行に(チップの title) */
function msScanTitle(row) {
  const sig = row.signals || {}, mark = flag => (flag ? "○" : "×");
  const rank = sig.rank_read === "max" ? t("msscan.rank.max") : sig.rank_read == null ? "?" : String(sig.rank_read);
  return fmt("msscan.signal", { text: row.read, laurel: mark(sig.laurel), bar: mark(sig.bar), rank });
}
function msScanRender(state) {
  $("#ms-scan-panel").hidden = false;
  if (state !== undefined) $("#ms-scan-state").textContent = state;
  const tabName = msScan.tab ? t("msscan.tab." + msScan.tab) : t("msscan.tab.none");
  $("#ms-scan-stats").textContent = fmt("msscan.stats", { reads: msScan.reads, seen: msScan.seen.size, added: msScan.added.length, tab: tabName });
  $("#ms-scan-new").innerHTML = msScan.added.length ? `<span class="mini">${esc(t("msscan.added"))}</span><div class="chips">${msScan.added.slice(-60).reverse()
    .map(row => `<button class="chip" data-ms-undo="${esc(row.id)}">${esc(msLabel(row))}<span class="x" aria-hidden="true">×</span></button>`).join("")}</div>` : "";
  const groups = [...msScan.maybe.entries()].map(([key, row]) => {
    const why = `<small>${esc(t("msscan.reason." + (row.reason || "confirm")))}</small>`;
    const cands = row.ids && row.ids.length > 1 ? row.ids : [row];
    const head = cands.length > 1 ? `<span class="chip-label">${esc(row.read)}:</span>` : "";
    return head + cands.map(cand => `<button class="chip" data-ms-own="${esc(cand.id)}" data-ms-key="${esc(key)}" title="${esc(msScanTitle(row))}">${esc(msLabel(cand))}${why}</button>`).join("");
  });
  $("#ms-scan-maybe").innerHTML = groups.length ? `<span class="mini">${esc(t("msscan.maybe"))}</span><div class="chips">${groups.join("")}</div>` : "";
  $("#ms-scan-hint").hidden = msScan.english;
  $("#ms-scan-unknown").innerHTML = msScan.unknown.size ? `<span class="mini">${esc(t("msscan.unknown"))}</span> <span class="mini">${esc([...msScan.unknown].join(" / "))}</span>` : "";
}
async function msMark(ids, done) {
  if (!ids.length) return;
  await api("/api/mastery", { method: "POST", body: { ids, done } });
  if (mastery) { const set = new Set(ids); mastery.rows.forEach(row => { if (set.has(row.id)) row.done = done; }); renderMastery(); }
}
/* 画像(ファイル・動画の1コマ)を PNG にする。JPEG・WebP や、16bit・パレットの PNG もサーバーが読める形にそろえる */
async function msToPng(source) {
  const canvas = document.createElement("canvas");
  if (source instanceof Blob) {
    const bitmap = await createImageBitmap(source);
    canvas.width = bitmap.width; canvas.height = bitmap.height; canvas.getContext("2d").drawImage(bitmap, 0, 0); bitmap.close();
  } else { canvas.width = source.videoWidth; canvas.height = source.videoHeight; canvas.getContext("2d").drawImage(source, 0, 0); }
  return await new Promise(done => canvas.toBlob(done, "image/png"));
}
async function msScanImage(blob) {
  const res = await fetch("/api/mastery/scan", { method: "POST", headers: { "Content-Type": "image/png" }, body: blob });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.text ? renderTxt(body.text) : (body.error || fmt("err.http", { status: res.status })));
  msScan.reads++;
  if (body.tab) msScan.tab = body.tab;
  msScan.english = body.english !== false;  // 英語の文字認識が無いときは、追加をすすめる注意を出す
  const confirm = $("#ms-scan-confirm").checked, add = [];
  const addedIds = new Set(msScan.added.map(row => row.id));
  body.tiles.forEach(row => {
    msScan.seen.add(row.id);
    const multi = row.ids && row.ids.length > 1;
    if (!multi && (row.done || addedIds.has(row.id))) return;
    if (multi && row.ids.some(cand => cand.done || addedIds.has(cand.id))) return;  // 候補のどれかが済みなら聞かない
    if (row.state === "done" && !confirm) add.push(row);
    else msScan.maybe.set(multi ? row.ids.map(cand => cand.id).join("|") : row.id, row);
  });
  (body.unknown || []).forEach(text => msScan.unknown.add(text));
  if (add.length) {
    await msMark(add.map(row => row.id), true);
    msScan.added.push(...add); add.forEach(row => msScan.maybe.delete(row.id));
  }
  return body.tiles.length;
}
/** 画面が前回の読み取りから変わったか(小さく縮めた白黒画像の差で判断。MOD 側の frameChanged と同じ考え方) */
function msFrameChanged(video) {
  const canvas = document.createElement("canvas"); canvas.width = 64; canvas.height = 36;
  const ctx = canvas.getContext("2d", { willReadFrequently: true }); ctx.drawImage(video, 0, 0, 64, 36);
  const px = ctx.getImageData(0, 0, 64, 36).data, cur = new Uint8Array(64 * 36);
  for (let i = 0; i < cur.length; i++) cur[i] = (px[i * 4] + px[i * 4 + 1] + px[i * 4 + 2]) / 3;
  const prev = msScan.last; msScan.last = cur;
  if (!prev) return true;
  let diff = 0; for (let i = 0; i < cur.length; i++) diff += Math.abs(cur[i] - prev[i]);
  return diff / cur.length > 1.5;
}
async function msScanTick() {
  const video = $("#ms-scan-video");
  if (!msScan.on || msScan.busy || !video.videoWidth) return;
  if (!msFrameChanged(video)) { msScanRender(t("scan.waiting")); return; }
  msScan.busy = true;
  try {
    const blob = await msToPng(video);
    msScanRender(t("scan.reading"));
    const count = await msScanImage(blob);
    msScanRender(fmt("msscan.found", { n: count }));
  } catch (err) { msScanRender(fmt("scan.failed", { msg: err.message })); msScan.last = null; }
  msScan.busy = false;
}
async function msScanStart() {
  const info = await loadOcrInfo();
  if (!info.available) { msScanRender(fmt("scan.unavailable", { reason: ocrReason(info) })); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) { msScanRender(t("scan.nobrowser")); return; }
  try {
    msScan.stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 2 }, audio: false });
  } catch (err) { msScanRender(t("scan.cancel")); return; }
  const video = $("#ms-scan-video"); video.srcObject = msScan.stream; await video.play().catch(() => {});
  msScan.stream.getVideoTracks()[0].addEventListener("ended", msScanStop);  // ブラウザ側で「共有を停止」したとき
  msScan.on = true; msScan.last = null;
  msScanLabel();
  msScanRender(t("scan.reading"));
  msScan.timer = setInterval(msScanTick, 2500); msScanTick();
}
function msScanStop() {
  msScan.on = false; clearInterval(msScan.timer); msScan.timer = null;
  if (msScan.stream) msScan.stream.getTracks().forEach(track => track.stop());
  msScan.stream = null; $("#ms-scan-video").srcObject = null;
  msScanLabel();
  if (!$("#ms-scan-panel").hidden) msScanRender(t("scan.stopped"));
}
function msScanLabel() {
  $("#ms-scan-toggle").setAttribute("aria-pressed", String(msScan.on)); $("#ms-scan-toggle").textContent = t(msScan.on ? "scan.on" : "scan.off");
}
msScanLabel();
$("#ms-scan-toggle").addEventListener("click", () => msScan.on ? msScanStop() : msScanStart());
$("#ms-scan-file-btn").addEventListener("click", () => $("#ms-scan-files").click());
$("#ms-scan-files").addEventListener("change", async ev => {
  const files = [...ev.target.files]; ev.target.value = "";
  const info = await loadOcrInfo();
  if (!info.available) { msScanRender(fmt("scan.unavailable", { reason: ocrReason(info) })); return; }
  for (let i = 0; i < files.length; i++) {
    msScanRender(fmt("scan.files", { i: i + 1, n: files.length }));
    try { await msScanImage(await msToPng(files[i])); }
    catch (err) { msScanRender(fmt("scan.file.failed", { file: files[i].name, msg: err.message })); return; }
  }
  msScanRender(fmt("scan.files.done", { n: files.length }));
});
$("#ms-scan-panel").addEventListener("click", async ev => {
  const undo = ev.target.closest("[data-ms-undo]"), own = ev.target.closest("[data-ms-own]");
  try {
    if (undo) {
      const id = undo.dataset.msUndo;
      await msMark([id], false); msScan.added = msScan.added.filter(row => row.id !== id); msScanRender();
    }
    if (own) {
      const id = own.dataset.msOwn, row = msScan.maybe.get(own.dataset.msKey);
      const picked = row && row.ids ? row.ids.find(cand => cand.id === id) : row;
      await msMark([id], true); msScan.maybe.delete(own.dataset.msKey);
      if (picked) msScan.added.push(picked);
      msScanRender();
    }
  } catch (err) { msScanRender(err.message); }
});

/* ---------- クエスト一覧 ---------- */
/* 前提(requires)は API がそろえた形: node {id} / any {of: [id]} / mr {n} / note {text}。チェックできるかは state(locked は付けられない)。
   付ける・外すの最終判断はサーバー(POST /api/quests が 409 で断る)。状態は前提の完了で変わるので、返ってきた一覧ごと置き換える */
let quests = null, qsCat = "", qsArmed = null;

function qsReqs(r, by) {

function renderQuests() {

  const cur = $("#b-type").value, curF = $("#b-filter-type").value;
  $("#b-type").innerHTML = opts; if (cur) $("#b-type").value = cur;
  $("#b-filter-type").innerHTML = `<option value="">${esc(t("mods.type.all"))}</option>` + opts; $("#b-filter-type").value = curF;
}
$("#build-form").addEventListener("submit", async e => {
  e.preventDefault(); $("#b-err").textContent = "";
  const btn = $("#b-save"), name = $("#b-name").value.trim();
  btn.disabled = true;
  try {
    const r = await api("/api/builds", { method: "POST", body: {
      original_name: editing, name, type: $("#b-type").value, target: $("#b-target").value,
      forma: $("#b-forma").value, mods: $("#b-mods").value, arcanes: $("#b-arcanes").value, tags: $("#b-tags").value, note: $("#b-note").value, helminth: helmValue(), shards: shardValue(),
      images: formImages.filter(i => i.saved).map(i => i.saved) } });
    builds = r.builds; modEffects = r.mod_effects || modEffects;
    // ビルドを保存してから、新しい画像を1枚ずつ送る
    editing = name;
    const pending = formImages.filter(i => !i.saved);
    for (let k = 0; k < pending.length; k++) {
      $("#b-err").textContent = fmt("b.saving.image", { i: k + 1, n: pending.length });
      const blob = await prepareImage(pending[k].blob);
      const res = await fetch(`/api/build-image?name=${encodeURIComponent(name)}`, { method: "POST", headers: { "Content-Type": blob.type || "image/png" }, body: blob });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(fmt("b.image.failed", { n: k + 1, msg: data.text ? renderTxt(data.text) : (data.error || res.status) }));
      builds = data.builds;
      pending[k].saved = data.builds.find(x => x.name === name).images.slice(-1)[0];
      URL.revokeObjectURL(pending[k].url); delete pending[k].url; delete pending[k].blob;
    }
    resetBuildForm(); renderBuilds();
  } catch (err) { $("#b-err").textContent = err.message; renderFormImages(); renderBuilds(); }
  btn.disabled = false;
});
/* 画像の追加: クリック / ドラッグ&ドロップ / 貼り付け */
$("#b-drop").addEventListener("click", () => $("#b-file").click());
$("#b-drop").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("#b-file").click(); } });
$("#b-file").addEventListener("change", e => { addImageFiles(e.target.files); e.target.value = ""; });
["dragenter", "dragover"].forEach(ev => $("#b-drop").addEventListener(ev, e => { e.preventDefault(); $("#b-drop").classList.add("over"); }));
["dragleave", "drop"].forEach(ev => $("#b-drop").addEventListener(ev, () => $("#b-drop").classList.remove("over")));
$("#b-drop").addEventListener("drop", e => { e.preventDefault(); addImageFiles(e.dataTransfer.files); });
document.addEventListener("paste", e => {
  if ($("#view-build").hidden) return;
  const files = [...(e.clipboardData ? e.clipboardData.files : [])].filter(f => f.type.startsWith("image/"));
  if (!files.length) return;
  e.preventDefault(); addImageFiles(files);
});
$("#b-thumbs").addEventListener("click", e => {
  const rm = e.target.closest("[data-rm]");
  if (rm) { const [im] = formImages.splice(+rm.dataset.rm, 1); if (im.url) URL.revokeObjectURL(im.url); renderFormImages(); return; }
  const tb = e.target.closest(".thumb"); if (!tb) return;
  openLightbox(formImages.map(im => im.saved ? imgUrl(im.saved) : im.url), +tb.dataset.i);
});
/* 拡大表示 */
let lb = { urls: [], i: 0 };
function showLightbox() {
  const n = lb.urls.length; $("#lb-img").src = lb.urls[lb.i]; $("#lb-open").href = lb.urls[lb.i];
  $("#lb-count").textContent = `${lb.i + 1} / ${n}`; $("#lb-prev").disabled = $("#lb-next").disabled = n < 2;
}
function openLightbox(urls, i) { lb = { urls, i }; showLightbox(); $("#lightbox").showModal(); }
const lbMove = d => { lb.i = (lb.i + d + lb.urls.length) % lb.urls.length; showLightbox(); };
$("#lb-prev").addEventListener("click", () => lbMove(-1));
$("#lb-next").addEventListener("click", () => lbMove(1));
$("#lb-close").addEventListener("click", () => $("#lightbox").close());
$("#lightbox").addEventListener("click", e => { if (e.target.id === "lightbox") $("#lightbox").close(); });
$("#lightbox").addEventListener("keydown", e => { if (e.key === "ArrowLeft") lbMove(-1); if (e.key === "ArrowRight") lbMove(1); });
$("#b-cancel").addEventListener("click", resetBuildForm);
$("#b-filter").addEventListener("input", renderBuilds);
$("#b-filter-type").addEventListener("change", renderBuilds);
$("#build-list").addEventListener("click", async e => {
  const ed = e.target.closest("[data-edit]"), del = e.target.closest("[data-del]"), view = e.target.closest("[data-view-img]");
  if (view) {
    const b = builds.find(x => x.name === view.dataset.viewImg);
    if (b) openLightbox(b.images.map(imgUrl), +view.dataset.i);
    return;
  }
  if (ed) {
    const b = builds.find(x => x.name === ed.dataset.edit); if (!b) return;
    editing = b.name; $("#b-name").value = b.name; $("#b-type").value = b.type; $("#b-target").value = b.target || "";
    $("#b-forma").value = b.forma || 0; $("#b-mods").value = (b.mods || []).join("\n"); $("#b-arcanes").value = (b.arcanes || []).map(arcLabel).join("\n"); $("#b-tags").value = (b.tags || []).join(",");
    $("#b-note").value = b.note || ""; renderBuildFormTitle(); $("#b-cancel").hidden = false;
    $("#b-helm-slot").value = b.helminth ? String(b.helminth.slot) : ""; $("#b-helm-ability").value = b.helminth ? b.helminth.ability : ""; helmToggle();
    renderShardSlots(b.shards || []); shardToggle();
    clearFormImages(); formImages = (b.images || []).map(n => ({ saved: n })); renderFormImages();
    $("#build-form-wrap").open = true; $("#b-name").focus(); window.scrollTo({ top: 0, behavior: "smooth" });
  } else if (del) {
    const name = del.dataset.del;
    if (armed !== name) { armed = name; renderBuilds(); setTimeout(() => { if (armed === name) { armed = null; renderBuilds(); } }, 4000); return; }
    armed = null;
    try { builds = (await api(`/api/builds?name=${encodeURIComponent(name)}`, { method: "DELETE" })).builds; if (editing === name) resetBuildForm(); renderBuilds(); }
    catch (err) { $("#b-err").textContent = err.message; }
  }
});
loaders.build = () => {
  applyViewText("build"); renderBuildFormTitle(); loadOcrInfo();
  return loadBuilds().catch(e => { $("#build-list").innerHTML = noData(e.message); });
};
relabel.build = () => {
  // 入力欄のアルケインは、一覧にある名前だけ新しい言語に置き換える(書きかけの名前はそのまま)
  if (arcaneNames.length) { $("#b-arcanes").value = arcLines().map(arcLabel).join("\n"); renderArcList(); }
  applyViewText("build"); renderBuildFormTitle(); renderOcrNote(); renderFormImages(); arcNote();
  if (btypes.length) { renderBuildTypes(); renderHelmSlots(); helmNote(); renderShardSlots(); renderBuilds(); }
  if (ocrResult && !$("#b-ocr").hidden) renderOcr(ocrResult);
};

/* ---------- データ更新 ---------- */
$("#update-btn").addEventListener("click", async () => {
  const btn = $("#update-btn"), log = $("#update-log");
  btn.disabled = true; btn.textContent = t("upd.fetching"); log.hidden = false; log.textContent = t("upd.fetching.log");
  try {
    // 表示中の言語も送る(日英のほかの言語なら、その言語の名前辞書も取る。ja・en はサーバーが毎回取る)
    const r = await api("/api/update", { method: "POST", body: { lang } });
    showLog(log, r);
    itemSearch.reset(); mods = null; rivens = null; modOpen = null; mastery = null; quests = null; arcanes = null;
    simReload();  // シミュレータ用データも「データ更新」で作り直すので、開いていれば読み直す
  } catch (e) { log.textContent = e.message; }
  btn.disabled = false; btn.textContent = t("upd.btn"); refreshStatus();
});
/* ログの表示: 結果を覚えておき、言語を切り替えたら描き直す(ログの欄ごと) */
const shownLogs = new Map();
function showLog(el, r) { shownLogs.set(el, r); el.textContent = renderLog(r, t(r.ok ? "common.done" : "common.failed")); }
function relabelLogs() { shownLogs.forEach((r, el) => { el.textContent = renderLog(r, t(r.ok ? "common.done" : "common.failed")); }); }
loaders.update = () => { applyViewText("update"); return refreshStatus(); };
relabel.update = () => { applyViewText("update"); renderStatus(); relabelLogs(); };

/* ---------- トップ・ページ説明 ---------- */
/* どちらも MENU から組み立てる(ページを足すと自動で載る)。ノンカテゴリのページ(トップ自身を除く)は「その他」にまとめる */
function menuSections() {
  const out = [], other = [];
  MENU.forEach(e => {
    if (e.group) {
      const items = e.items.filter(pageVisible);
      if (items.length) out.push({ label: t("group." + e.group), items });
    } else if (e.page !== "home" && pageVisible(e.page)) other.push(e.page);
  });
  if (other.length) out.push({ label: t("group.other"), items: other });
  return out;
}
/* ページのマークアップの文字を表示中の言語にする(決まりは web/i18n.html の applyText) */
function applyViewText(id) { const root = $(`#view-${id}`); if (root) applyText(root); }
function renderHome() {
  applyViewText("home");
  $("#home-beta").checked = betaOn;
  $("#home-cards").innerHTML = menuSections().map(s => `<div class="card"><header><b>${esc(s.label)}</b></header>${
    s.items.map(v => `<button type="button" class="go" data-go="${esc(v)}"><b>${esc(t("page." + v))}${betaTag(v) ? " " + betaTag(v) : ""}</b><span>${esc(t("page." + v + ".sub"))}</span></button>`).join("")}</div>`).join("");
}
$("#home-beta").addEventListener("change", e => { setBeta(e.target.checked); renderHome(); });
function renderGuide() {
  applyViewText("guide");
  $("#guide-list").innerHTML = menuSections().map(s => `<h3 class="guide-h">${esc(s.label)}</h3><div class="cards">${
    s.items.filter(v => v !== "guide").map(v => `<div class="card"><header><b>${esc(t("page." + v))}</b>${betaTag(v)}<button type="button" class="btn ghost guide-go" data-go="${esc(v)}">${esc(t("guide.open"))}</button></header><p class="guide-text">${esc(t("guide." + v))}</p></div>`).join("")}</div>`).join("");
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (b) { show(b.dataset.go); window.scrollTo(0, 0); }
});
loaders.home = relabel.home = renderHome;
loaders.guide = relabel.guide = renderGuide;

/* ---------- 起動 ---------- */
(async () => {
  const s = await refreshStatus();
  let v = "home";  // 初めて開いたとき(前回のページの記録が無いとき)はトップ
  try { v = localStorage.getItem("wf-view") || "home"; } catch (e) {}
  const MOVED_VIEWS = { part: "item" };  // まとめたページ: 前回の記録が古い id なら移った先を開く(パーツ検索 → アイテムから探す)
  v = MOVED_VIEWS[v] || v;
  if (!views.includes(v)) v = "home";
  show(s && !s.has_drops ? "update" : v);
})();
</script>
<div class="unofficial" role="note" lang="ja">非公式ファンツール <span lang="en">/ Unofficial fan tool</span></div>
</body>
