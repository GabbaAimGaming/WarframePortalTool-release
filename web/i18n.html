<!-- 文字を引く部品: 言語ごとの表(I18N)と、t・fmt・renderTxt などの関数。ブラウザに覚える設定(pref)・API の応答の読み方(apiRead・apiImage)もここ
     (メイン画面とシミュレータで共用する部品はこれだけなので)。
     メイン画面(web/ctrl.html)とシミュレータ(web/wfportal_builder.html)の両方に差し込む(wfp/api/pages.py)。
     I18N の中身は web/i18n/<言語>.json。組み立てるとき pages.py が下の目印(I18N:DATA)に差し込む。 -->
<!-- PART:script -->
<script>
/* ---------- ブラウザに覚える設定(localStorage) ---------- */
/* 使えないブラウザ(プライベートモードなど)でも止まらないよう、読み書きの失敗は黙って無視する(読みは既定値)。
   localStorage を直接触らずにこれを使う(tests/test_menu.py が検査)。
   get: 文字列(無い・空なら d)/ flag・setFlag: "1" / "0" のオン・オフ / json・setJson: JSON(無い・壊れていれば d) */
const pref = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null || v === "" ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} },
  flag(k) { return this.get(k) === "1"; },
  setFlag(k, on) { this.set(k, on ? "1" : "0"); },
  json(k, d = null) { const v = this.get(k); if (v == null) return d; try { return JSON.parse(v); } catch (e) { return d; } },
  setJson(k, v) { this.set(k, JSON.stringify(v)); },
};

/* ---------- 表示する文字(言語ごと) ---------- */
/* 中身は web/i18n/<言語>.json(キー → 文字)。画面を組み立てるとき wfp/api/pages.py が下の目印の行に差し込む。
   言語を足すときは JSON を1つ足すだけ(切り替えのボタンも自動で増える)。各言語の lang.name / lang.short がボタンの文字。
   今の言語に無いキーは日本語、それも無ければキーそのものを表示する。
   キーの決まり:
   - spex.item.<小文字の名前>: 交換の報酬名の置き換え(キーは JSON の綴りの小文字。末尾の数量 " x3" は除いた名前)。
     表に無いものは原文(英語)のまま出すので、英語の表には置かない
   - invasion.part.<kind>: 侵略のパーツの種類(同梱の parts.json の kind)
   - mastery.cat.<キー>: マスター一覧・パーツ検索のカテゴリー(キーは wfp/core/common.py の MASTERY_CATS)
   - 表示名の表(planet. mode. rarity. src.cat. mod.type. arcane.cat. baro.kind. など)の日本語は wfp/core/common.py の JA_TABLES と同じにする(テストで確認) */
const I18N = /* I18N:DATA */ {};
let lang = "ja";
function t(key) {
  const own = I18N[lang] && I18N[lang][key];
  return own != null ? own : (I18N.ja[key] != null ? I18N.ja[key] : key);
}
/* 文字の中の {名前} を値で置き換える(例: fmt("invasion.sum", { owned: 1, total: 5 })) */
function fmt(key, vals) {
  return t(key).replace(/\{(\w+)\}/g, (m, k) => (vals && vals[k] != null ? String(vals[k]) : m));
}
/* 表にあるキーか(表示中の言語か日本語) */
const hasText = key => (I18N[lang] && I18N[lang][key] != null) || I18N.ja[key] != null;
/* 表示名の表のキー(prefix + 名前)。表に無い名前はそのまま出す(例: tName("planet.", "Mercury")) */
const tName = (prefix, name) => (name && hasText(prefix + name) ? t(prefix + name) : (name || ""));
/* API が返す「テキスト指定」を文にする(決まりは wfp/core/common.py の render_txt と同じ):
   文字列はそのまま / リストは list.sep でつなぐ / {k, v, d} は表の文の {名前} を v で置き換え(表に無ければ d)/
   {l: {言語: 文}} は表示中の言語、無ければ ja、en の順 */
function renderTxt(x) {
  if (x == null) return "";
  if (typeof x === "string") return x;
  if (typeof x === "number") return String(x);
  if (Array.isArray(x)) return x.map(renderTxt).join(t("list.sep"));
  if (x.l) return [lang, "ja", "en"].map(c => x.l[c]).find(s => s) || "";
  if (typeof x.k === "string") {
    if (!hasText(x.k)) return x.d != null ? x.d : x.k;
    const v = x.v || {};
    return t(x.k).replace(/\{(\w+)\}/g, (m, k) => (k in v ? renderTxt(v[k]) : m));
  }
  return String(x);
}
/* ゲームの名前など、ja と en の両方を持つ行の表示名: 日本語の画面は和名(空なら英名)、ほかの言語は英名(空なら和名)。
   キーの名前が違う行は ja・en に渡す(例: nameByLang(r, "weapon_ja", "weapon_en"))。esc はしないので、HTML に入れるときは esc(…) */
const nameByLang = (x, ja = "ja", en = "en") => (x ? (lang === "ja" ? x[ja] || x[en] : x[en] || x[ja]) || "" : "");
/* 日本語の画面で和名と英名が違うとき、名前の横に小さく出す英名(<span class="sub-en">。cls で class を変えられる)。
   ほかの言語・同じ名前・和名が無ければ空。esc は中でする(esc は差し込む側のページの基礎スクリプトにある) */
const subEn = (x, ja = "ja", en = "en", cls = "sub-en") =>
  (x && lang === "ja" && x[ja] && x[ja] !== x[en] ? `<span class="${cls}">${esc(x[en])}</span>` : "");
/* 日付・数値の書式に使うロケール(各言語の lang.locale。無ければ言語コードのまま) */
const locale = () => (I18N[lang] && I18N[lang]["lang.locale"]) || lang;
/* データ更新などのログ(API の lines = [{level, text}])を表示中の言語の文にする。行が無ければ fallback */
function renderLog(r, fallback = "") {
  if (r && Array.isArray(r.lines) && r.lines.length) return r.lines.map(l => "  ".repeat(l.level || 0) + renderTxt(l.text)).join("\n");
  return fallback;
}
/* ---------- API の応答(メイン画面とシミュレータで共用) ---------- */
/* 応答を読む: JSON(読めなければ {})を返す。エラーの応答なら、テキスト指定(text)があれば表示中の言語の文、無ければ日本語の文(error)、
   それも無ければ HTTP の番号の文で Error を投げる(e.status に番号) */
/* サーバーに要求を送る(fetch を呼ぶのはここだけ)。届かないとき(ツールを閉じた後・通信が切れた)は、
   ブラウザの生の文("Failed to fetch" など)ではなく I18N の文(err.offline)のエラーにする。e.offline = true */
async function apiFetch(path, init) {
  try { return await fetch(path, init); }
  catch (cause) { const e = new Error(t("err.offline")); e.offline = true; e.cause = cause; throw e; }
}
async function apiRead(res) {
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const e = new Error(data.text ? renderTxt(data.text) : (data.error || fmt("err.http", { status: res.status })));
    e.status = res.status;
    throw e;
  }
  return data;
}
/* 画像(Blob / File)を本文にして POST する(文字認識・ビルドの画像)。type を省けば blob の種類、それも無ければ PNG */
async function apiImage(path, blob, type) {
  return apiRead(await apiFetch(path, { method: "POST", headers: { "Content-Type": type || blob.type || "image/png" }, body: blob }));
}
/* 最初に表示する言語: URL の ?lang=、無ければこの PC に覚えた言語(localStorage の wf-lang)、無ければ日本語 */
function initialLang() {
  const q = new URLSearchParams(location.search).get("lang");
  const saved = pref.get("wf-lang");
  return q && I18N[q] ? q : (saved && I18N[saved] ? saved : "ja");
}
/* ページのマークアップの文字を表示中の言語にする: data-i18n(中身)・data-i18n-placeholder(入力欄の例)・
   data-i18n-aria(読み上げの名前)・data-i18n-title(ヒント)。root の中だけ */
function applyText(root) {
  root.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  root.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  root.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
  root.querySelectorAll("[data-i18n-title]").forEach(el => { el.title = t(el.dataset.i18nTitle); });
}
</script>
