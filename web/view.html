/* THEME:START */

    --on-secondary: #ecf3f3;
    --accent: #80d9e2;

  }
}

  --panel-2: #172a2e;
  --line: #1f3c40;
  --ink: #ecf3f3;
  --mute: #899294;
  --primary: #5a949a;
  --primary-bg: #5a949a;

* { box-sizing: border-box; }

/* 画面の枠: ヘッダー(上に固定)+ 本体。ページ全体はスクロールせず、メニュー(nav)と表示画面(main)がそれぞれスクロールする(2026-11-07)。狭い画面は下の @media で全体のスクロールに戻す */
.app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100vh; height: 100dvh; overflow: hidden; }

/* ---- ヘッダー ---- */
header {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 12px 20px; background: var(--secondary); color: var(--on-secondary);
  border-bottom: 1px solid var(--line); position: relative;
}
header::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
  background: linear-gradient(90deg, var(--primary-bg), var(--accent) 60%, transparent);
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  --h: 30px; height: var(--h); width: calc(var(--h) * var(--logo-ratio, 1.6)); flex: none;
  background: linear-gradient(135deg, var(--on-secondary), var(--primary-bg) 85%);
  -webkit-mask: var(--logo-url) center / contain no-repeat; mask: var(--logo-url) center / contain no-repeat;
}
.brand h1 { margin: 0; font-size: 18px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
.brand small { color: var(--mute); letter-spacing: .08em; }

.pill {
  font-size: 12px; padding: 3px 10px; border: 1px solid var(--line); background: transparent;
  color: var(--on-secondary); opacity: .85; font-variant-numeric: tabular-nums;
}
.pill.warn { color: var(--danger); border-color: var(--danger); opacity: 1; }
/* β版の機能の切り替え(ヘッダー右・言語の切り替えの左) */
.beta-sw { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--on-secondary); opacity: .85; cursor: pointer; user-select: none; }
.beta-sw input { margin: 0; accent-color: var(--accent); cursor: pointer; }
.beta-sw:has(input:checked) { opacity: 1; color: var(--accent); }
/* 言語の切り替え(ヘッダー右)。押している言語はアクセント色 */
.lang-sw { display: flex; margin-right: 10px; }
.lang-sw[hidden] { display: none; }
.lang-sw button {
  font: inherit; font-size: 12px; padding: 3px 9px; cursor: pointer; letter-spacing: .06em;
  border: 1px solid var(--line); background: transparent; color: var(--on-secondary); opacity: .7;
}
.lang-sw button + button { margin-left: -1px; }
.lang-sw button[aria-pressed="true"] { position: relative; opacity: 1; color: var(--accent); border-color: var(--accent); font-weight: 700; }
.lang-sw button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---- 非公式表記(右下に常時表示) ---- */
.unofficial {
  position: fixed; right: 10px; bottom: 8px; z-index: 1000; pointer-events: none;
  font-size: 11px; line-height: 1.4; padding: 2px 8px; border-radius: 4px;

/* ---- 本体: 左メニュー + 表示画面 ---- */
.body { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; padding: 16px 20px 24px; min-height: 0; }
nav { display: flex; flex-direction: column; gap: 6px; align-content: start; min-height: 0; overflow-y: auto; padding-right: 2px; }  /* 収まらないときだけメニューの中でスクロール */
nav .label { font-size: 11px; letter-spacing: .14em; color: var(--mute); margin: 2px 4px 4px; text-transform: uppercase; }
nav button {
  text-align: left; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line);
  border-left: 3px solid transparent; cursor: pointer;
}
nav button:hover { background: var(--panel-2); }
nav button[aria-current="page"] {
  background: var(--panel-2); border-left-color: var(--primary-bg); color: var(--primary); font-weight: 700;
}
nav button .sub { display: block; font-size: 11px; font-weight: 400; color: var(--mute); }
/* カテゴリー(押すと中の項目が開く。同時に開くのは1つだけ) */
nav .nav-group { display: flex; flex-direction: column; gap: 6px; }
nav .nav-cat { display: flex; align-items: center; gap: 8px; font-weight: 700; }

  content: ""; flex: none; width: 0; height: 0; border-style: solid; border-width: 4px 0 4px 6px;
  border-color: transparent transparent transparent var(--mute); transition: transform .15s;
}
nav .nav-cat[aria-expanded="true"]::before { transform: rotate(90deg); }
/* 表示中のページを含むカテゴリー(閉じていても分かるように) */
nav .nav-cat.has-current { border-left-color: var(--primary-bg); color: var(--primary); }
nav .nav-cat.has-current::before { border-left-color: var(--primary-bg); }
nav .nav-items { display: flex; flex-direction: column; gap: 6px; padding-left: 12px; }
nav .nav-items[hidden] { display: none; }
nav button .nav-icon { width: 18px; height: 18px; vertical-align: -4px; margin-right: 6px; }

main { background: var(--panel); border: 1px solid var(--line); padding: 20px 22px 44px; min-height: 0; min-width: 0; overflow-y: auto; }  /* 下の余白は右下の非公式表記のぶん。スクロールの戻しは ctrl.html の scrollView */
main h2 { margin: 0 0 4px; font-size: 18px; }
main .lead { margin: 0 0 16px; color: var(--mute); }
section[hidden] { display: none; }

/* ---- 部品 ---- */
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
input[type=text], input[type=number], select, textarea {
  background: var(--bg); border: 1px solid var(--line); padding: 8px 10px; min-width: 0;
}
input[type=text].search { flex: 1 1 260px; font-size: 15px; }
textarea { width: 100%; resize: vertical; }
label.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--mute); cursor: pointer; }
.btn {
  padding: 8px 16px; cursor: pointer; background: var(--primary-bg); color: var(--on-primary);
  border: 1px solid transparent; font-weight: 700;
}
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 400; }
.btn.ghost:hover { background: var(--panel-2); }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); font-weight: 400; }
.btn.danger.armed { background: var(--danger); color: var(--bg); font-weight: 700; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }

}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.chip small { color: var(--mute); margin-left: 6px; }

.result-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 18px 0 8px; }
.result-head h3 { margin: 0; font-size: 17px; }
.result-head .en { color: var(--mute); }
.count { color: var(--accent); font-variant-numeric: tabular-nums; }
/* 入手先の表の敵の名前(押すと敵から探すへ) */
.go-enemy { padding: 0; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;
  text-decoration: underline dotted; text-underline-offset: 3px; }
.go-enemy:hover { color: var(--accent); }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-size: 12px; color: var(--mute); background: var(--panel-2); letter-spacing: .06em; font-weight: 600; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
.chance { display: flex; align-items: center; gap: 10px; min-width: 160px; }
.chance .bar { flex: 1; height: 6px; background: var(--panel-2); position: relative; }
.chance .bar i { position: absolute; inset: 0 auto 0 0; width: var(--w); background: linear-gradient(90deg, var(--accent), var(--primary-bg)); }
.chance b { width: 62px; text-align: right; font-weight: 600; }
.rar { font-size: 12px; padding: 1px 8px; border: 1px solid currentColor; }
.rar.Common { color: var(--rar-common); } .rar.Uncommon { color: var(--rar-uncommon); }
.rar.Rare { color: var(--rar-rare); } .rar.Legendary { color: var(--rar-legendary); }
.tag-event { color: var(--accent); font-size: 12px; margin-left: 6px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 14px; margin-top: 14px; }
.card { border: 1px solid var(--line); background: var(--bg); min-width: 0; }
.card > header { color: var(--ink); padding: 9px 14px; background: var(--panel-2); border: 0; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.card > header::after { display: none; }
.card > header b { font-size: 15px; }
.card > header span { color: var(--mute); }
.card .tablewrap { border: 0; }
.card td:first-child { color: var(--accent); width: 1%; }

.note { color: var(--mute); font-size: 12px; margin-top: 12px; }
.empty { padding: 28px 8px; color: var(--mute); }
.err { color: var(--danger); margin: 10px 0 0; }

/* サイクル */
.clock { font-family: var(--mono); font-size: 28px; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.cyc-phase { font-size: 20px; font-weight: 700; }
.cyc-phase.day, .cyc-phase.warm, .cyc-phase.corpus { color: var(--primary); }
.cyc-phase.night, .cyc-phase.cold, .cyc-phase.grineer { color: var(--accent); }
.cyc-next { color: var(--mute); }
.cyc-src { font-size: 11px; color: var(--mute); border: 1px solid var(--line); padding: 0 6px; margin-left: auto; }
.cyc-src.worldstate { color: var(--accent); border-color: currentColor; }
.cyc-sync { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
#cycle-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-top: 14px; }
#cycle-layout > .cards { margin-top: 0; }
/* 鋼の道のり交換: 今週の報酬と、今後の週の一覧 */
.spex { display: flex; flex-direction: column; }
.spex .spex-now { font-size: 20px; font-weight: 700; }
.spex .tablewrap { border-top: 1px solid var(--line); }
.spex thead th { position: sticky; top: 0; }
/* 広い画面: 左のカードは3列に固定(ZARIMAN・ウィークリーリセットが右端に来る)、右に交換のカードを2行ぶんの高さで置く。
   交換のカードは左の高さに合わせ(押し広げない)、一覧はカード内でスクロールする */
@media (min-width: 1700px) {
  #cycle-layout { grid-template-columns: minmax(0, 1fr) 340px; }
  #cycle-layout > .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  #cycle-spex { position: relative; }
  #cycle-spex > .spex { position: absolute; inset: 0; }
  .spex .tablewrap { flex: 1; min-height: 0; overflow: auto; }
}

/* 侵略サイクル: 左 = 侵略ミッション / 右 = 獲得パーツ(広い画面だけ2カラム。狭い画面は下に並ぶ) */
#inv-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px 24px; }
/* 侵略ミッションは件数で縦に伸びるので、画面の高さを超えたら一覧の中でスクロールする(ページ全体は伸ばさない) */
.inv-list { display: grid; gap: 12px; align-content: start; max-height: max(360px, calc(100vh - 260px)); overflow-y: auto; padding-right: 4px; }
.inv-parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 12px; }
/* 広い画面: 侵略ミッション 1/3・獲得パーツ 2/3 */
@media (min-width: 1200px) {
  #inv-layout { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
}
.inv-vs { margin-left: auto; font-size: 12px; }
/* 陣営の色(文字とバーで共通)。テーマの配色から選ぶ: グリニア = rare / コーパス = accent / 感染体 = legendary */
.inv-fac { --fac: var(--mute); color: var(--fac); font-weight: 700; }
.FC_GRINEER { --fac: var(--rar-rare); }
.FC_CORPUS { --fac: var(--accent); }
.FC_INFESTATION { --fac: var(--rar-legendary); }
/* 仲裁: 開催中の行を目立たせる。敵グループの色は侵略サイクルの .inv-fac / .FC_* を使う(表に色が無い勢力は文字の色) */
#arb-out tr.now > td { background: var(--panel-2); font-weight: 700; }
/* 目立たせる仲裁(防衛・耐久 かつ 感染体。条件は Python の ARBY_PICK): 開催中はオレンジ・まだの枠はクリーム */
#arb-out tr.pick > td { background: #fbf3d9; }
#arb-out tr.pick.now > td { background: #f8c88a; }
#arb-out .arb-left { display: block; font-size: 12px; font-weight: 400; color: var(--accent); }
.inv-bar { display: flex; height: 8px; background: var(--panel-2); border: 1px solid var(--line); }
.inv-bar > i { display: block; background: var(--fac, var(--accent)); }
.inv-pct { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
.inv-sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px 14px; margin-top: 6px; }
.inv-sides > div { min-width: 0; display: grid; gap: 2px; align-content: start; }
.inv-sides .note { margin: 0; }
.inv-rw.part { color: var(--accent); font-weight: 700; }
.card .pad.inv-pick { display: flex; flex-wrap: wrap; gap: 6px 16px; }  /* 2行目: パーツを横に並べる */
.inv-pick label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
.inv-pick label.active { color: var(--accent); font-weight: 700; }
.inv-warn { border-color: var(--danger); }
.inv-warn > header b { color: var(--danger); }

/* バロ吉入手一覧 */
.baro-h { margin: 22px 0 6px; font-size: 15px; }
#baro-now .card { margin-top: 14px; }
.baro-state { font-weight: 700; color: var(--primary); }
.baro-state.coming, .baro-state.gone { color: var(--mute); }
.baro-mark { font-weight: 700; color: var(--accent); }
.tag-mini { font-size: 11px; color: var(--mute); border: 1px solid var(--line); padding: 0 5px; margin-left: 6px; white-space: nowrap; }

details { margin-top: 18px; border: 1px solid var(--line); padding: 10px 14px; background: var(--bg); }

/* ビルド */

.field > span { font-size: 12px; color: var(--mute); }

.build .helm { margin: 6px 0; }

.build .shards ol { margin: 2px 0 0; }
.mini.err { color: var(--danger); }
.arc { font-size: 12px; padding: 1px 8px; border: 1px solid var(--rar-legendary); color: var(--rar-legendary); }

pre.log { background: var(--bg); border: 1px solid var(--line); padding: 12px; overflow: auto; max-height: 340px; white-space: pre-wrap; font-family: var(--mono); font-size: 12.5px; }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 18px; margin: 0 0 16px; }
dl.kv dt { color: var(--mute); } dl.kv dd { margin: 0; font-variant-numeric: tabular-nums; }

/* 入手先の種類 */
.cat { font-size: 12px; padding: 1px 8px; background: var(--panel-2); border: 1px solid var(--line); white-space: nowrap; }
.cat.enemy { border-color: var(--danger); color: var(--danger); }
.cat.bounty, .cat.special, .cat.key, .cat.sortie { border-color: var(--rar-rare); color: var(--rar-rare); }
.cat.relic { border-color: var(--rar-legendary); color: var(--rar-legendary); }
.cat.mission { border-color: var(--accent); color: var(--accent); }
.cat.clan, .cat.simaris, .cat.quest { border-color: var(--rar-uncommon); color: var(--rar-uncommon); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
/* デュヴィリサーキット: 今週・今後の見出し */
.dv-h { font-size: 15px; margin: 18px 0 8px; }
