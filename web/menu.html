let lang = "ja";
function t(key) {
  const own = I18N[lang] && I18N[lang][key];
  return own != null ? own : (I18N.ja[key] != null ? I18N.ja[key] : key);
}
/* 言語の切り替え(いまは画面にボタンを出さない。確認用に URL の ?lang=en で切り替わる) */
function setLang(code) {
  if (!I18N[code]) return;
  lang = code;
  document.documentElement.lang = code;
  renderMenu();
}

/* ---------- メニュー ---------- */
/* 並びとカテゴリー分け。項目はページの id(<section id="view-○○">)。
   文字は I18N の group.<カテゴリー> / page.<ページ> / page.<ページ>.sub から取る。
   ページ(section)がまだ無い項目は表示しない(作ったら自動で出る) */
const MENU = [
  { page: "home" },
  { group: "search", items: ["item", "part", "area"] },
  { group: "personal", items: ["mastery", "mods", "arcane", "baro"] },
  { group: "info", items: ["riven", "invasion", "cycle", "duviri"] },
  { group: "simulation", items: ["build", "sim"] },
  { page: "tips" },
  { page: "guide" },
  { page: "update" },
];
const pageExists = id => !!document.getElementById("view-" + id);
const menuGroups = () => MENU.filter(e => e.group).map(e => ({ ...e, items: e.items.filter(pageExists) })).filter(e => e.items.length);
const groupOf = view => (menuGroups().find(e => e.items.includes(view)) || {}).group || null;
let views = [];          // 表示できるページの一覧(メニューの並び順)
let currentView = null;  // 表示中のページ
let openGroup = null;    // 開いているカテゴリー(同時に1つだけ)

function navButton(view) {
  const b = document.createElement("button");
  b.type = "button"; b.dataset.view = view; b.textContent = t("page." + view);
  const sub = document.createElement("span");
  sub.className = "sub"; sub.textContent = t("page." + view + ".sub");
  b.append(sub);
  return b;
}
function renderMenu() {
  const nav = $("#nav");
  nav.setAttribute("aria-label", t("menu.aria"));
  const title = document.createElement("div");
  title.className = "label"; title.textContent = t("menu.title");
  const parts = [title];
  views = [];
  const groups = menuGroups();
  MENU.forEach(e => {
    if (e.page) {
      if (!pageExists(e.page)) return;
      views.push(e.page);
      parts.push(navButton(e.page));
      return;
    }
    const g = groups.find(x => x.group === e.group);
    if (!g) return;
    const wrap = document.createElement("div");
    wrap.className = "nav-group";
    const cat = document.createElement("button");
    cat.type = "button"; cat.className = "nav-cat"; cat.dataset.group = g.group;
    cat.id = "nav-cat-" + g.group; cat.setAttribute("aria-controls", "nav-items-" + g.group);
    cat.textContent = t("group." + g.group);
    const items = document.createElement("div");
    items.className = "nav-items"; items.id = "nav-items-" + g.group;
    items.setAttribute("role", "group"); items.setAttribute("aria-labelledby", cat.id);
    g.items.forEach(v => { views.push(v); items.append(navButton(v)); });
    wrap.append(cat, items);
    parts.push(wrap);
  });
  nav.replaceChildren(...parts);
  applyMenuState();
}
/* 開閉と「表示中」の印を反映する */
function applyMenuState() {
  const curGroup = groupOf(currentView);
  document.querySelectorAll("#nav .nav-cat").forEach(cat => {
    const g = cat.dataset.group, open = g === openGroup;
    cat.setAttribute("aria-expanded", String(open));
    cat.classList.toggle("has-current", g === curGroup);
    $("#nav-items-" + g).hidden = !open;
  });
  document.querySelectorAll("#nav [data-view]").forEach(b => {
    if (b.dataset.view === currentView) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
}
$("#nav").addEventListener("click", e => {
  const page = e.target.closest("[data-view]"), cat = e.target.closest("[data-group]");
  if (page) show(page.dataset.view);
  else if (cat) { openGroup = openGroup === cat.dataset.group ? null : cat.dataset.group; applyMenuState(); }
});

/* ---------- ビュー切り替え ---------- */
const loaders = {};
/* ページを離れてよいかを聞く関数(編集中のページが登録する)。どれかが false を返したら移らない */
const leaveGuards = [];
function show(view) {
  if (view !== currentView && leaveGuards.some(ok => !ok(view))) return;
  views.forEach(v => { $("#view-" + v).hidden = v !== view; });
  currentView = view;
  const g = groupOf(view);
  if (g) openGroup = g;  // 起動時や別の画面から移ったときも、そのページのカテゴリを開く
  applyMenuState();
  try { localStorage.setItem("wf-view", view); } catch (e) {}
  loaders[view] && loaders[view]();
}
{
  const q = new URLSearchParams(location.search).get("lang");
  if (q && I18N[q]) { lang = q; document.documentElement.lang = q; }
  renderMenu();
}
