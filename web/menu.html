     web/ctrl.html の基礎スクリプト($ esc api など)のあと、ページ処理の前に読まれる。
     読み込んだ時点でページ(<section>)の有無を見てメニューを描くので、表示部(web/view.html)のマークアップが先に必要。 -->
<!-- PART:script -->
<script>
/* ---------- 表示する文字(言語ごと) ---------- */
/* キー → 文字。今の言語に無いキーは日本語、それも無ければキーそのものを表示する。
   いまはメニューとデュヴィリサーキットのページが対象(ページの文字はマークアップの data-i18n か t("…") で引く)。
   中身は JSON と同じ形にしてあるので、増えたら別ファイルに切り出せる */
const I18N = {
  ja: {
    "menu.aria": "メニュー", "menu.title": "Menu",
    "group.search": "素材検索", "group.personal": "個人チェック表", "group.info": "情報", "group.simulation": "シミュレーション",
    "page.item": "素材から探す", "page.item.sub": "素材名 → 入手場所と確率",
    "page.area": "エリアから探す", "page.area.sub": "惑星・ノード → 出る素材",
    "page.mastery": "マスター一覧", "page.mastery.sub": "Warframe・武器のマスター状況",
    "page.mods": "MOD入手一覧", "page.mods.sub": "入手先と所持チェック",
    "page.arcane": "アルケイン所持一覧", "page.arcane.sub": "所持チェックとランク",
    "page.baro": "バロ吉入手一覧", "page.baro.sub": "Void商人の商品と所持の照合",
    "page.riven": "Riven相場", "page.riven.sub": "公式の週次統計",
    "page.dispo": "Riven性質", "page.dispo.sub": "武器ごとの性質(●1〜5)",
    "page.cycle": "サイクル", "page.cycle.sub": "昼夜・リセット",
    "page.duviri": "デュヴィリサーキット", "page.duviri.sub": "週替わりの報酬",
    "page.build": "ビルド", "page.build.sub": "登録と管理",
    "page.sim": "シミュレータ", "page.sim.sub": "フレーム・武器・Riven の計算",
    "page.tips": "Tips", "page.tips.sub": "すぐ見たいメモ",
    "page.update": "データ更新", "page.update.sub": "公式データの取得",
    "duviri.lead": "サーキットで選べる報酬の今週分と、来週以降の並びです。毎週月曜 9:00(JST)のウィークリーリセットで切り替わります。",
    "duviri.normal": "ノーマル", "duviri.steelpath": "鋼の道のり",
    "duviri.current": "今週の報酬", "duviri.upcoming": "今後のローテーション",
    "duviri.date": "週(月曜)", "duviri.col": "報酬{n}", "duviri.weekday": "(月)",
    "duviri.manual": "手動で調整中", "duviri.broken": "ローテーションのデータが読めません。",
    "duviri.none": "ローテーションが1件だけなので、今後の表はありません。", "duviri.loading": "読み込み中...",
    "duviri.adjust": "ゲーム内とズレているとき(手動で調整)", "duviri.adjust.id": "今週の ID(表示中のモード)",
    "duviri.adjust.save": "保存", "duviri.adjust.reset": "同梱の設定に戻す",
    "duviri.adjust.help": "ゲーム内の今週の報酬に合う ID を選んで保存すると、以降はそこから毎週進めて表示します。調整はモードごとで、ツールの更新では消えません。「同梱の設定に戻す」で調整を消せます。",
  },
  en: {
    "menu.aria": "Menu", "menu.title": "Menu",
    "group.search": "Material Search", "group.personal": "Personal Checklists", "group.info": "Info", "group.simulation": "Simulation",
    "page.item": "Find by Material", "page.item.sub": "Material → where it drops",
    "page.area": "Find by Area", "page.area.sub": "Planet / node → drops",
    "page.mastery": "Mastery", "page.mastery.sub": "Mastery progress",
    "page.mods": "Mods", "page.mods.sub": "Sources and owned mods",
    "page.arcane": "Arcanes", "page.arcane.sub": "Owned arcanes and ranks",
    "page.baro": "Baro Ki'Teer", "page.baro.sub": "Void Trader items vs. owned",
    "page.riven": "Riven Prices", "page.riven.sub": "Official weekly stats",
    "page.dispo": "Riven Disposition", "page.dispo.sub": "Disposition per weapon",
    "page.cycle": "Cycles", "page.cycle.sub": "Day/night and resets",
    "page.duviri": "Duviri Circuit", "page.duviri.sub": "Weekly rewards",
    "page.build": "Builds", "page.build.sub": "Save and manage",
    "page.sim": "Simulator", "page.sim.sub": "Frame / weapon / Riven math",
    "page.tips": "Tips", "page.tips.sub": "Quick notes",
    "page.update": "Data Update", "page.update.sub": "Fetch official data",
    "duviri.lead": "This week's Circuit rewards and the rotation for the coming weeks. Changes at the weekly reset (Monday 0:00 UTC).",
    "duviri.normal": "Normal", "duviri.steelpath": "Steel Path",
    "duviri.current": "This week", "duviri.upcoming": "Upcoming rotation",
    "duviri.date": "Week of", "duviri.col": "Reward {n}", "duviri.weekday": " (Mon)",
    "duviri.manual": "Adjusted manually", "duviri.broken": "The rotation data could not be read.",
    "duviri.none": "There is only one rotation, so nothing is upcoming.", "duviri.loading": "Loading...",
    "duviri.adjust": "Out of sync with the game? (adjust manually)", "duviri.adjust.id": "This week's ID (current mode)",
    "duviri.adjust.save": "Save", "duviri.adjust.reset": "Back to bundled settings",
    "duviri.adjust.help": "Pick the ID that matches this week's rewards in game; the rotation advances from there every week. Adjustments are per mode and survive tool updates.",
  },
};
let lang = "ja";
function t(key) {
  const own = I18N[lang] && I18N[lang][key];
  return own != null ? own : (I18N.ja[key] != null ? I18N.ja[key] : key);
}
/* 言語の切り替え(いまは画面にボタンを出さない。確認用に URL の ?lang=en で切り替わる) */
function setLang(code) {
  if (!I18N[code]) return;
  lang = code;
  document.documentElement.lang = code;
  renderMenu();
}

/* ---------- メニュー ---------- */
/* 並びとカテゴリー分け。項目はページの id(<section id="view-○○">)。
   文字は I18N の group.<カテゴリー> / page.<ページ> / page.<ページ>.sub から取る。
   ページ(section)がまだ無い項目は表示しない(作ったら自動で出る) */
const MENU = [
  { group: "search", items: ["item", "area"] },
  { group: "personal", items: ["mastery", "mods", "arcane", "baro"] },
  { group: "info", items: ["riven", "dispo", "cycle", "duviri"] },
  { group: "simulation", items: ["build", "sim"] },
  { page: "tips" },
  { page: "update" },
];
const pageExists = id => !!document.getElementById("view-" + id);
const menuGroups = () => MENU.filter(e => e.group).map(e => ({ ...e, items: e.items.filter(pageExists) })).filter(e => e.items.length);
const groupOf = view => (menuGroups().find(e => e.items.includes(view)) || {}).group || null;
let views = [];          // 表示できるページの一覧(メニューの並び順)
let currentView = null;  // 表示中のページ
let openGroup = null;    // 開いているカテゴリー(同時に1つだけ)

function navButton(view) {
  const b = document.createElement("button");
  b.type = "button"; b.dataset.view = view; b.textContent = t("page." + view);
  const sub = document.createElement("span");
  sub.className = "sub"; sub.textContent = t("page." + view + ".sub");
  b.append(sub);
  return b;
}
function renderMenu() {
  const nav = $("#nav");
  nav.setAttribute("aria-label", t("menu.aria"));
  const title = document.createElement("div");
  title.className = "label"; title.textContent = t("menu.title");
  const parts = [title];
  views = [];
  const groups = menuGroups();
  MENU.forEach(e => {
    if (e.page) {
      if (!pageExists(e.page)) return;
      views.push(e.page);
      parts.push(navButton(e.page));
      return;
    }
    const g = groups.find(x => x.group === e.group);
    if (!g) return;
    const wrap = document.createElement("div");
    wrap.className = "nav-group";
    const cat = document.createElement("button");
    cat.type = "button"; cat.className = "nav-cat"; cat.dataset.group = g.group;
    cat.id = "nav-cat-" + g.group; cat.setAttribute("aria-controls", "nav-items-" + g.group);
    cat.textContent = t("group." + g.group);
    const items = document.createElement("div");
    items.className = "nav-items"; items.id = "nav-items-" + g.group;
    items.setAttribute("role", "group"); items.setAttribute("aria-labelledby", cat.id);
    g.items.forEach(v => { views.push(v); items.append(navButton(v)); });
    wrap.append(cat, items);
    parts.push(wrap);
  });
  nav.replaceChildren(...parts);
  applyMenuState();
}
/* 開閉と「表示中」の印を反映する */
function applyMenuState() {
  const curGroup = groupOf(currentView);
  document.querySelectorAll("#nav .nav-cat").forEach(cat => {
    const g = cat.dataset.group, open = g === openGroup;
    cat.setAttribute("aria-expanded", String(open));
    cat.classList.toggle("has-current", g === curGroup);
    $("#nav-items-" + g).hidden = !open;
  });
  document.querySelectorAll("#nav [data-view]").forEach(b => {
    if (b.dataset.view === currentView) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
}
$("#nav").addEventListener("click", e => {
  const page = e.target.closest("[data-view]"), cat = e.target.closest("[data-group]");
  if (page) show(page.dataset.view);
  else if (cat) { openGroup = openGroup === cat.dataset.group ? null : cat.dataset.group; applyMenuState(); }
});

/* ---------- ビュー切り替え ---------- */
const loaders = {};
function show(view) {
  views.forEach(v => { $("#view-" + v).hidden = v !== view; });
  currentView = view;
  const g = groupOf(view);
  if (g) openGroup = g;  // 起動時や別の画面から移ったときも、そのページのカテゴリを開く
  applyMenuState();
  try { localStorage.setItem("wf-view", view); } catch (e) {}
  loaders[view] && loaders[view]();
}
{
  const q = new URLSearchParams(location.search).get("lang");
  if (q && I18N[q]) { lang = q; document.documentElement.lang = q; }
  renderMenu();
}

</script>
